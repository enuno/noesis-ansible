---
- name: Check whether tmux is already installed
  ansible.builtin.command:
    cmd: command -v tmux
  register: tmux_binary_check
  changed_when: false
  failed_when: false

- name: Install tmux on macOS via Homebrew
  ansible.builtin.command:
    cmd: "brew install {{ tmux_brew_formula }}"
  when:
    - ansible_system == 'Darwin'
    - tmux_binary_check.rc != 0
  register: tmux_brew_install
  changed_when: true

- name: Install tmux on Linux via the package manager
  ansible.builtin.package:
    name: "{{ tmux_package_name }}"
    state: present
  become: true
  when:
    - ansible_system == 'Linux'
    - tmux_binary_check.rc != 0
  register: tmux_linux_install
