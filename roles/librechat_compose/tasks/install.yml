---
- name: Bring up pinned LibreChat Compose services
  community.docker.docker_compose_v2:
    project_src: "{{ librechat_compose_root }}"
    project_name: "{{ librechat_compose_project }}"
    files: [compose.yaml]
    state: present
    pull: missing
    wait: true
    wait_timeout: 180
  no_log: true
  when: not ansible_check_mode
