---
- name: Validate LibreChat Compose inputs
  ansible.builtin.assert:
    that:
      - librechat_compose_release == 'v0.8.8'
      - librechat_compose_image == 'registry.librechat.ai/librechat-ai/librechat:v0.8.8'
      - librechat_compose_root is match('^/[^ ]+$')
      - librechat_compose_project is match('^[a-z][a-z0-9_-]*$')
      - librechat_compose_port | int > 0
      - librechat_compose_port | int < 65536
      - librechat_compose_bind_address == '127.0.0.1'
    fail_msg: LibreChat Compose inputs must be pinned and loopback-only.
- name: Refuse live Compose changes without explicit opt-in
  ansible.builtin.assert:
    that: librechat_compose_live_changes | bool
    fail_msg: Set librechat_compose_live_changes=true for this specific deployment.
  when: not ansible_check_mode
- name: Check Docker Compose on the managed host
  ansible.builtin.command:
    argv: [docker, compose, version]
  register: librechat_compose_cli
  changed_when: false
  when: not ansible_check_mode
