---
- name: Create LibreChat Compose directory
  ansible.builtin.file:
    path: "{{ librechat_compose_root }}"
    state: directory
    mode: '0750'
- name: Render LibreChat Compose manifest
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ librechat_compose_root }}/compose.yaml"
    mode: '0640'
- name: Inspect pre-provisioned LibreChat credentials
  ansible.builtin.stat:
    path: "{{ librechat_compose_root }}/.env"
  register: librechat_compose_env_stat
- name: Require a protected credentials file
  ansible.builtin.assert:
    that:
      - librechat_compose_env_stat.stat.isreg | default(false)
      - (librechat_compose_env_stat.stat.mode | default('')) == '0600'
      - (librechat_compose_env_stat.stat.uid | default(-1) | int) == 0
    fail_msg: >-
      Provision {{ librechat_compose_root }}/.env out of band (mode 0600)
      with CREDS_KEY, CREDS_IV, JWT_SECRET, JWT_REFRESH_SECRET and
      MEILI_MASTER_KEY; this role does not generate or rotate credentials.
  when: not ansible_check_mode
- name: Read LibreChat credentials without displaying them
  ansible.builtin.slurp:
    src: "{{ librechat_compose_root }}/.env"
  register: librechat_compose_env_raw
  no_log: true
  when: not ansible_check_mode
- name: Validate required credentials are present and nonempty
  ansible.builtin.assert:
    that:
      - (librechat_compose_env_raw.content | b64decode) is search('(?m)^CREDS_KEY=.+$')
      - (librechat_compose_env_raw.content | b64decode) is search('(?m)^CREDS_IV=.+$')
      - (librechat_compose_env_raw.content | b64decode) is search('(?m)^JWT_SECRET=.+$')
      - (librechat_compose_env_raw.content | b64decode) is search('(?m)^JWT_REFRESH_SECRET=.+$')
      - (librechat_compose_env_raw.content | b64decode) is search('(?m)^MEILI_MASTER_KEY=.+$')
    fail_msg: One or more required LibreChat secrets are missing or empty.
  no_log: true
  when: not ansible_check_mode
