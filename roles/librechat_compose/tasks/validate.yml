---
- name: Verify LibreChat reports ready on the managed host
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ librechat_compose_port }}/readyz"
    status_code: 200
    return_content: true
  register: librechat_compose_health
  retries: 20
  delay: 6
  until:
    - librechat_compose_health.status | default(0) == 200
    - librechat_compose_health.content | default('') == 'OK'
  when: not ansible_check_mode
