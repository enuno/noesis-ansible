---
# Handlers for the native OpenClaw gateway role.

- name: restart openclaw gateway
  ansible.builtin.systemd:
    name: openclaw-gateway.service
    scope: user
    state: restarted
    daemon_reload: true
  become_user: "{{ openclaw_gateway_owner_user }}"

- name: reload openclaw gateway
  ansible.builtin.systemd:
    name: openclaw-gateway.service
    scope: user
    state: restarted
    daemon_reload: true
  become_user: "{{ openclaw_gateway_owner_user }}"
