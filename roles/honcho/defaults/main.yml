---
# Honcho role defaults.
# Stages the Honcho memory module and renders runtime config for Noesis.

honcho_enabled: "{{ noesispraxis_enable_honcho | default(false) | bool }}"

# Source of truth from the noesis-agent-stack checkout on the control node
honcho_module_src: "{{ lookup('env', 'HOME') }}/projects/noesis-agent-stack/honcho"

# Target staging/runtime paths on the managed host
honcho_stage_dir: "{{ ansible_facts.env.HOME | default('/home/elvis') }}/.local/share/noesis/honcho"
honcho_runtime_dir: "{{ ansible_facts.env.HOME | default('/home/elvis') }}/.config/noesis/honcho"
honcho_backup_dir: "{{ honcho_stage_dir }}/backups"

# Environment overlay to activate
honcho_environment: prod
honcho_workspace_id: noesis-prod

# Secret references only; the role never writes live keys to Git
honcho_api_endpoint_ref: "secret://honcho/api-endpoint"
honcho_api_key_ref: "secret://honcho/shared-gateway"
honcho_mempalace_transport: stdio

# Optional per-agent allowlist to surface in the runtime manifest
honcho_mcp_tool_allowlist:
  - memory.read_scoped
  - memory.write_attributed
  - memory.search_scoped
  - memory.context
  - memory.conclusion_search
  - memory.queue_status
  - memory.file_ingest
  - memory.chat

# Validation
honcho_validate_script: "{{ honcho_stage_dir }}/scripts/validate-honcho-profiles.py"
honcho_validate_connectivity: false
honcho_validate_queue: false

