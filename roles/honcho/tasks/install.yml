---
- name: Assert Honcho module source exists on control node
  ansible.builtin.stat:
    path: "{{ honcho_module_src }}/README.md"
  delegate_to: localhost
  register: honcho_module_stat

- name: Fail when Honcho module source is missing
  ansible.builtin.fail:
    msg: >-
      Honcho module not found at {{ honcho_module_src }}. Point honcho_module_src
      at the noesis-agent-stack checkout that contains honcho/.
  when: not honcho_module_stat.stat.exists

- name: Ensure Honcho stage/runtime directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ honcho_stage_dir }}"
    - "{{ honcho_runtime_dir }}"
    - "{{ honcho_backup_dir }}"

- name: Stage the Honcho module bundle onto the target
  ansible.builtin.copy:
    src: "{{ honcho_module_src }}/"
    dest: "{{ honcho_stage_dir }}/"
    mode: preserve
    directory_mode: '0755'

