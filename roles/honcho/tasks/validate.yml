---
- name: Validate Honcho profile bundle
  ansible.builtin.command: "python3 {{ honcho_validate_script }}"
  register: honcho_validation
  changed_when: false
  when: not ansible_check_mode

- name: Show Honcho validation summary
  ansible.builtin.debug:
    var: honcho_validation.stdout
  when:
    - not ansible_check_mode
    - honcho_validation is defined

- name: Confirm runtime files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  register: honcho_runtime_stats
  loop:
    - "{{ honcho_runtime_dir }}/honcho.env"
    - "{{ honcho_runtime_dir }}/overlay.yaml"
    - "{{ honcho_runtime_dir }}/active-policy.yaml"
  when: not ansible_check_mode

- name: Fail if runtime files are missing
  ansible.builtin.fail:
    msg: "Missing Honcho runtime file: {{ item.stat.path }}"
  loop: "{{ honcho_runtime_stats.results | default([]) }}"
  when:
    - not ansible_check_mode
    - not item.stat.exists

