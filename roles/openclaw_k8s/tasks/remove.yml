---
- name: Validate removal inputs
  ansible.builtin.assert:
    that:
      - openclaw_k8s_kubeconfig_path is match('^/')
      - openclaw_k8s_kube_context | length > 0
      - "'CHANGE_ME' not in openclaw_k8s_kube_context"
      - openclaw_k8s_release_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - openclaw_k8s_namespace is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - not (openclaw_k8s_destroy_pvc | bool) or openclaw_k8s_destroy_pvc_confirm == 'DELETE-OPENCLAW-PVC'
    fail_msg: Removal inputs failed closed validation.

- name: Uninstall OpenClaw while retaining PVC state
  kubernetes.core.helm:
    binary_path: "{{ openclaw_k8s_helm_binary_path }}"
    kubeconfig: "{{ openclaw_k8s_kubeconfig_path }}"
    context: "{{ openclaw_k8s_kube_context }}"
    release_name: "{{ openclaw_k8s_release_name }}"
    release_namespace: "{{ openclaw_k8s_namespace }}"
    release_state: absent
    wait: true
    timeout: "{{ openclaw_k8s_helm_timeout }}"
  tags: [remove]

- name: Require exact confirmation before PVC deletion
  ansible.builtin.assert:
    that:
      - openclaw_k8s_destroy_pvc_confirm == 'DELETE-OPENCLAW-PVC'
    fail_msg: Set openclaw_k8s_destroy_pvc_confirm to DELETE-OPENCLAW-PVC after backup verification.
  when: openclaw_k8s_destroy_pvc | bool
  tags: [destroy]

- name: Delete the chart-created PVC after explicit confirmation
  kubernetes.core.k8s:
    kubeconfig: "{{ openclaw_k8s_kubeconfig_path }}"
    context: "{{ openclaw_k8s_kube_context }}"
    state: absent
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ openclaw_k8s_namespace }}"
    name: "{{ openclaw_k8s_release_name }}-home"
  when:
    - openclaw_k8s_destroy_pvc | bool
    - openclaw_k8s_existing_claim | length == 0
  tags: [destroy]
