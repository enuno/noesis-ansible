---
# Noesis-maintained OpenClaw Kubernetes deployment defaults.
# Safe defaults are private, single-replica, persistent, and non-destructive.

openclaw_k8s_kubeconfig_path: /etc/rancher/k3s/k3s.yaml
openclaw_k8s_kube_context: ""
openclaw_k8s_helm_binary_path: /usr/local/bin/helm
openclaw_k8s_kubectl_binary_path: /usr/local/bin/kubectl
openclaw_k8s_kubernetes_python_version: "34.1.0"
openclaw_k8s_kubernetes_venv: /opt/ansible-kubernetes

openclaw_k8s_release_name: openclaw
openclaw_k8s_namespace: openclaw
openclaw_k8s_desired_state: present
openclaw_k8s_chart_version: "0.2.1"
openclaw_k8s_chart_app_version: "2026.10.7"
openclaw_k8s_chart_source: "{{ playbook_dir | dirname }}/charts/openclaw/{{ openclaw_k8s_chart_version }}"
openclaw_k8s_chart_path: "/opt/openclaw-chart/{{ openclaw_k8s_chart_version }}"
openclaw_k8s_stage_dir: /opt/openclaw-stage

# Upstream release pin. Source of truth:
#   https://api.github.com/repos/openclaw/openclaw/releases
# v2026.10.7 is the latest non-prerelease, non-draft release (published
# 2026-10-24). The `-slim` variant is the image upstream's own Kubernetes
# manifests use. The digest is the multi-arch OCI index for that exact tag,
# resolved from GHCR and confirmed to carry linux/amd64 + linux/arm64; the
# chart deploys BY DIGEST so the tag cannot drift under the release.
openclaw_k8s_image_repository: ghcr.io/openclaw/openclaw
openclaw_k8s_image_tag: "2026.10.7-slim"
openclaw_k8s_image_digest: sha256:fb26f0841659dc757f23feec9adeab51f11d76779a409db5d22e191b43841afa
openclaw_k8s_image_pull_policy: IfNotPresent

openclaw_k8s_replica_count: 1
openclaw_k8s_strategy: Recreate
openclaw_k8s_existing_secret: ""
openclaw_k8s_worker_identity: ""
openclaw_k8s_broker_endpoint: ""
openclaw_k8s_broker_secret_name: ""
openclaw_k8s_broker_secret_key: ""

openclaw_k8s_persistence_enabled: true
openclaw_k8s_persistence_size: 10Gi
openclaw_k8s_persistence_access_mode: ReadWriteOnce
openclaw_k8s_storage_class: ""
openclaw_k8s_existing_claim: ""

# --- Tailnet exposure via the Tailscale Kubernetes Operator ------------------
# Exposure is opt-in per run (keep the restrictive default in the role), but
# when enabled these are the values this deployment uses.
#
# The hostname names the SERVICE, never the server and never the operator's own
# device. The operator mints the device under this exact name and appends the
# tailnet domain itself, so this is a bare HOSTSPEC -- never a *.ts.net FQDN.
# Resulting MagicDNS name: noesis-openclaw.<tailnet domain>.
openclaw_k8s_exposure_enabled: false
openclaw_k8s_ingress_class_name: tailscale
openclaw_k8s_tailnet_hostname: noesis-openclaw
openclaw_k8s_tailnet_domain: tailf99a0.ts.net
openclaw_k8s_tailscale_operator_namespace: tailscale

# Names that must never be claimed by this service's proxy device. The operator
# mints a device per Ingress, so claiming a name already in use HIJACKS that
# identity: the new proxy takes the name and the original endpoint stops
# resolving to its real backend. Reserved here are the operator's own device,
# the Kubernetes node name, and the physical host's device.
openclaw_k8s_reserved_hostnames:
  - tailscale-operator
  - noesis-praxis
  - noesis-lab

# The Control UI validates the browser's ACTUAL origin, which is the full
# MagicDNS name -- not the bare hostspec. Derived rather than hand-written so
# the two can never drift apart.
openclaw_k8s_allowed_origins:
  - "https://{{ openclaw_k8s_tailnet_hostname }}.{{ openclaw_k8s_tailnet_domain }}"

# `lan` binds the gateway on all pod interfaces so the operator's proxy pod can
# reach it through the ClusterIP Service. `loopback` (the correct default when
# NOT exposed) is reachable only via `kubectl port-forward` and makes a
# Tailscale Ingress return 502. The chart fails closed on this mismatch.
openclaw_k8s_gateway_bind: "{{ 'lan' if (openclaw_k8s_exposure_enabled | bool) else 'loopback' }}"
openclaw_k8s_gateway_auth_mode: token

# Reverse proxies whose forwarded-client headers may be trusted. The gateway
# fails closed with 403 proxy_attribution_required when a request carries
# proxy headers from a source that is NOT listed here -- which is exactly what
# the Tailscale operator's Ingress proxy produces.
#
# The operator's proxy pods take DYNAMIC IPs from the cluster pod CIDR, so
# listing a single IP would break on every proxy reschedule. The pod CIDR is
# the narrowest stable value for this single-tenant cluster; tighten it if the
# operator's proxy pods are ever given a dedicated range.
#
# This must match the cluster's podCIDR exactly -- verify with
#   kubectl get nodes -o jsonpath='{.items[0].spec.podCIDR}'
# (currently 10.42.0.0/24 on noesis-praxis). A broader range trusts more
# sources than necessary; a narrower one silently breaks the proxy path.
openclaw_k8s_trusted_proxies:
  - "10.42.0.0/24"
openclaw_k8s_external_messaging_enabled: false
openclaw_k8s_funnel_enabled: false

openclaw_k8s_service_type: ClusterIP
openclaw_k8s_service_port: 18789
openclaw_k8s_helm_wait: true
openclaw_k8s_helm_timeout: 10m0s
openclaw_k8s_helm_atomic: true
openclaw_k8s_helm_create_namespace: true
openclaw_k8s_helm_history_max: 10
openclaw_k8s_live_checks: false
openclaw_k8s_destroy_pvc: false
openclaw_k8s_destroy_pvc_confirm: ""
