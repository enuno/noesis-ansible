---
# muxd role defaults

muxd_config_dir: "{{ ansible_env.HOME }}/.config/muxd"
muxd_data_dir: "{{ ansible_env.HOME }}/.local/share/muxd"

# Hub binds to the Tailscale interface by default so the coordinator is only
# reachable on the tailnet. Use 0.0.0.0 to bind all interfaces.
muxd_hub_bind: "100.106.20.102"
muxd_hub_port: 4097
muxd_hub_token: ""

# Daemon only needs to be reachable by the hub on the same host. Bind to
# localhost so it is not exposed to the network.
muxd_daemon_bind: "127.0.0.1"
muxd_node_name: "{{ ansible_hostname }}"

# Provider/model/API key for the daemon. Leave empty to configure hub + node registration only.
# Supported providers: anthropic, openai, fireworks, google, mistral, grok, deepinfra, zai, ollama
muxd_provider: ""
muxd_model: ""
muxd_api_key: "{{ vault_mistral_api_key | default('') if muxd_provider == 'mistral' else '' }}"

muxd_api_key_field_map:
  anthropic: anthropic_api_key
  openai: openai_api_key
  fireworks: fireworks_api_key
  google: google_api_key
  mistral: mistral_api_key
  grok: grok_api_key
  deepinfra: deepinfra_api_key
  zai: zai_api_key

# When the hub is bound to a Tailscale IP, opening the host firewall is not
# required and should be disabled.
muxd_firewall_manager: "auto"  # auto, ufw, firewalld, none
muxd_open_firewall: false
