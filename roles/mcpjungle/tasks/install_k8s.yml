---
- name: Validate MCPJungle target and configuration before any change
  ansible.builtin.assert:
    that:
      - mcpjungle_k8s_enabled | bool
      - mcpjungle_k8s_namespace is defined and mcpjungle_k8s_namespace | length > 0
      - mcpjungle_k8s_kubeconfig is defined and mcpjungle_k8s_kubeconfig | length > 0
      - mcpjungle_k8s_context is defined and mcpjungle_k8s_context | length > 0
      - mcpjungle_k8s_release_name is defined and mcpjungle_k8s_release_name | length > 0
      # The project id is enforced, not merely defaulted. See tasks/secrets.yml.
      - mcpjungle_k8s_bw_project_id == mcpjungle_k8s_required_bw_project_id
      - mcpjungle_k8s_chart_version is defined and mcpjungle_k8s_chart_version | length > 0
      - mcpjungle_k8s_image_digest is defined
      - mcpjungle_k8s_image_digest is match('^sha256:[0-9a-f]{64}$')
      - mcpjungle_k8s_image_tag != 'latest'
      - mcpjungle_k8s_database_mode in ['postgres', 'sqlite']
      - (mcpjungle_k8s_database_mode == 'sqlite') or (mcpjungle_k8s_database_postgres_host | length > 0)
    fail_msg: >-
      MCPJungle Kubernetes preflight failed. Never select a kubectl context
      implicitly: set mcpjungle_k8s_kubeconfig and mcpjungle_k8s_context
      explicitly. The Bitwarden project id must be exactly
      {{ mcpjungle_k8s_required_bw_project_id }} (got
      {{ mcpjungle_k8s_bw_project_id | default('<unset>') }}). The image must be
      pinned to an immutable digest, never 'latest'.
    tags: [mcpjungle, k8s, validate]

- name: Check that the target user can actually read the kubeconfig
  ansible.builtin.stat:
    path: "{{ mcpjungle_k8s_kubeconfig }}"
  register: mcpjungle_k8s_kubeconfig_stat
  become: false
  tags: [mcpjungle, k8s, validate]

- name: Fail with a useful message when the kubeconfig is unreadable
  ansible.builtin.fail:
    msg: >-
      The remote user cannot read {{ mcpjungle_k8s_kubeconfig }} (exists:
      {{ mcpjungle_k8s_kubeconfig_stat.stat.exists }}, readable:
      {{ mcpjungle_k8s_kubeconfig_stat.stat.readable | default(false) }}).
      That file is 0660 elvis:elvis in a 0700 directory and the `ansible` account
      is not in group `elvis`, so the run would die with an opaque permission
      error. Either run as the owning account
      (-e noesispraxis_ansible_user=elvis), or explicitly authorise granting the
      `ansible` account read access to this cluster-admin credential.
  when:
    - not mcpjungle_k8s_kubeconfig_stat.stat.exists
      or not (mcpjungle_k8s_kubeconfig_stat.stat.readable | default(false))
  tags: [mcpjungle, k8s, validate]

- name: Check the Bitwarden CLI and token are usable on the target
  ansible.builtin.command:
    cmd: "{{ mcpjungle_k8s_bws_path }} --version"
  environment:
    BWS_ACCESS_TOKEN: "{{ mcpjungle_k8s_bws_access_token
      | default(lookup('env', 'BWS_ACCESS_TOKEN'), true) }}"
  register: mcpjungle_k8s_bws_preflight
  changed_when: false
  failed_when: false
  become: false
  tags: [mcpjungle, k8s, validate]

- name: Fail when Bitwarden escrow cannot authenticate on the target
  ansible.builtin.fail:
    msg: >-
      Bitwarden escrow is not usable as the '{{ mcpjungle_k8s_bws_access_token
      | default('') | length > 0 | ternary('configured', 'unconfigured') }}'
      case on the target: bws rc={{ mcpjungle_k8s_bws_preflight.rc | default(-1) }}.
      BWS_ACCESS_TOKEN is present in elvis's shell profile but NOT in the
      `ansible` account, so an escrow run as `ansible` would fail to
      authenticate. Do NOT work around this by storing credentials elsewhere.
  when:
    - mcpjungle_k8s_database_mode == 'postgres'
    - not ansible_check_mode
    - mcpjungle_k8s_bws_preflight.rc | default(1) != 0
  tags: [mcpjungle, k8s, validate]

- name: Resolve the target cluster context explicitly (no implicit current-context)
  kubernetes.core.k8s_cluster_info:
    kubeconfig: "{{ mcpjungle_k8s_kubeconfig }}"
    context: "{{ mcpjungle_k8s_context }}"
    invalidate_cache: true
  register: mcpjungle_k8s_target
  changed_when: false
  tags: [mcpjungle, k8s, validate]

- name: Fail closed if the named context is absent from the kubeconfig
  ansible.builtin.assert:
    that:
      - mcpjungle_k8s_context in (mcpjungle_k8s_target.connection | default({}) | dict2items
         | map(attribute='value.contexts') | list | flatten | map(attribute='name') | list)
    fail_msg: >-
      Context '{{ mcpjungle_k8s_context }}' was not found in
      {{ mcpjungle_k8s_kubeconfig }}. Refusing to fall back to the current
      kubectl context.
  tags: [mcpjungle, k8s, validate]

# M9: this role does NOT create the database or role. It only references an
# existing one. Say so loudly rather than letting the release come up and fail
# to connect at runtime with a confusing application error.
- name: Warn that the database and role must already exist
  ansible.builtin.debug:
    msg: >-
      MCPJungle connects to an EXISTING PostgreSQL instance as database
      '{{ mcpjungle_k8s_database_postgres_database }}' / user
      '{{ mcpjungle_k8s_database_postgres_user }}' at
      {{ mcpjungle_k8s_database_postgres_host }}:{{ mcpjungle_k8s_database_postgres_port }}.
      This role does NOT create that database or role and does NOT manage the
      database lifecycle, backups, or migrations. Provision them first.
  when: mcpjungle_k8s_database_mode == 'postgres'
  tags: [mcpjungle, k8s, validate]

- name: Ensure the MCPJungle namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ mcpjungle_k8s_kubeconfig }}"
    context: "{{ mcpjungle_k8s_context }}"
    state: present
    api_version: v1
    kind: Namespace
    name: "{{ mcpjungle_k8s_namespace }}"
    definition: "{{ (lookup('ansible.builtin.file', mcpjungle_k8s_namespace_manifest) | from_yaml) }}"
  tags: [mcpjungle, k8s, install]

- name: Ensure the database Secret exists, sourced from Bitwarden
  kubernetes.core.k8s:
    kubeconfig: "{{ mcpjungle_k8s_kubeconfig }}"
    context: "{{ mcpjungle_k8s_context }}"
    state: present
    api_version: v1
    kind: Secret
    name: "{{ mcpjungle_k8s_db_secret_name }}"
    namespace: "{{ mcpjungle_k8s_namespace }}"
    type: Opaque
    # value is resolved from Bitwarden in tasks/secrets.yml and held in a
    # no_log-guarded fact. Never rendered into a diff, log, or artifact.
    string_data:
      "{{ mcpjungle_k8s_db_secret_key }}": "{{ mcpjungle_k8s_db_password }}"
  no_log: true
  diff: false
  when:
    - mcpjungle_k8s_database_mode == 'postgres'
    - not ansible_check_mode
    # Creating the database Secret is gated on the credential already existing
    # in Bitwarden. Order matters: store first, then deliver.
    - mcpjungle_k8s_db_password is defined
    - mcpjungle_k8s_bw_stored | default(false) | bool
  tags: [mcpjungle, k8s, secrets]

- name: Build the Helm values tree from role variables
  ansible.builtin.set_fact:
    mcpjungle_k8s_rendered_values: >-
      {{ (mcpjungle_k8s_rendered_values | default({})) | combine({
           'replicaCount': 1,
           'image': {
             'repository': mcpjungle_k8s_image_repository,
             'tag': mcpjungle_k8s_image_tag,
             'digest': mcpjungle_k8s_image_digest,
             'pullPolicy': 'IfNotPresent',
           },
           'service': {'type': 'ClusterIP', 'port': 8080},
           'database': {
             'mode': mcpjungle_k8s_database_mode,
             'postgres': {
               'host': mcpjungle_k8s_database_postgres_host,
               'port': mcpjungle_k8s_database_postgres_port,
               'database': mcpjungle_k8s_database_postgres_database,
               'user': mcpjungle_k8s_database_postgres_user,
               'existingSecret': (mcpjungle_k8s_db_secret_name
                                  if mcpjungle_k8s_database_mode == 'postgres' else ''),
               'existingSecretKey': mcpjungle_k8s_db_secret_key,
             },
           },
           'ingress': {
             'enabled': mcpjungle_k8s_expose_enabled | bool,
             'className': mcpjungle_k8s_ingress_class,
             'host': mcpjungle_k8s_ingress_host,
             'tailnet': mcpjungle_k8s_ingress_tailnet,
             'tls': true,
           },
         }, recursive=true) }}
  no_log: true
  tags: [mcpjungle, k8s, install]

- name: Install or upgrade the MCPJungle Helm release
  kubernetes.core.helm:
    kubeconfig: "{{ mcpjungle_k8s_kubeconfig }}"
    context: "{{ mcpjungle_k8s_context }}"
    name: "{{ mcpjungle_k8s_release_name }}"
    chart_ref: "./charts/mcpjungle"
    release_namespace: "{{ mcpjungle_k8s_namespace }}"
    # Pinned chart version from the in-repo first-party chart.
    chart_version: "{{ mcpjungle_k8s_chart_version }}"
    create_namespace: false
    # Keep history bounded but non-zero so rollback is possible.
    wait: true
    timeout: "{{ mcpjungle_k8s_timeout }}"
    # Never leave a half-upgraded release behind on failure.
    atomic: true
    cleanup_on_fail: true
    state: present
    values: "{{ mcpjungle_k8s_rendered_values }}"
  register: mcpjungle_k8s_release
  # Rendered values may embed the resolved DB password; suppress the diff.
  no_log: true
  diff: false
  tags: [mcpjungle, k8s, install]

- name: Record the release revision for the runbook
  ansible.builtin.set_fact:
    mcpjungle_k8s_release_revision: >-
      {{ mcpjungle_k8s_release.status | default(0)
         | ansible.builtin.dict2items | selectattr('key','eq','revision')
         | map(attribute='value') | first | default('unknown') }}
  tags: [mcpjungle, k8s, install]
