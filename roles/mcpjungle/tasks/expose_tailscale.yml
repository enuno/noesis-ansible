---
# Tailnet-private exposure through the EXISTING Tailscale Kubernetes Operator.
#
# Mechanism (verified against this cluster's operator, v1.104.1):
#   * The operator is configured with OPERATOR_INGRESS_CLASS_NAME=tailscale, so a
#     standard networking.k8s.io/v1 Ingress with that class IS the supported
#     service-exposure path, and the operator mints a tailnet IP + hostname for
#     it. No TailscaleIngress CRD is installed in this cluster.
#   * A `connectors.tailscale.com` Connector was TRIED and rejected: its
#     spec.appConnector.routes must be CIDRs, so "service:8080" fails validation
#     ("must be of type cidr"). Connector is subnet routing, not service
#     exposure.
#
# Two things this deliberately never does:
#   * never advertises the operator's own device address (100.94.198.124,
#     hostname `tailscale-operator`) as the service endpoint;
#   * never names the device after the server. The hostname is the SERVICE name.

- name: Refuse to expose before credential escrow is verified
  ansible.builtin.assert:
    that:
      - mcpjungle_k8s_bw_stored | default(false) | bool
    fail_msg: >-
      Refusing to expose MCPJungle on the tailnet: required credentials are
      not confirmed stored in Bitwarden project
      {{ mcpjungle_k8s_required_bw_project_id }}. Exposure stays disabled until
      escrow succeeds.
  tags: [mcpjungle, k8s, expose]

- name: Require an explicit exposure decision and a service-name hostname
  ansible.builtin.assert:
    that:
      - mcpjungle_k8s_expose_enabled | bool
      - mcpjungle_k8s_connector_hostname | length > 0
      - mcpjungle_k8s_connector_hostname is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$')
    fail_msg: >-
      Tailnet exposure requires mcpjungle_k8s_expose_enabled=true and
      mcpjungle_k8s_connector_hostname set to a valid DNS label. The hostname
      must name the SERVICE, not the server, and must never be the operator's
      own device address.
  tags: [mcpjungle, k8s, expose]

- name: Refuse a hostname that collides with the operator device or the server
  ansible.builtin.assert:
    that:
      - mcpjungle_k8s_connector_hostname not in ['tailscale-operator', 'noesis-praxis']
    fail_msg: >-
      The tailnet hostname must name the service, not the server and not the
      Tailscale operator device. Got {{ mcpjungle_k8s_connector_hostname }}.
  tags: [mcpjungle, k8s, expose]

- name: Enable the Tailscale ingress in the rendered values
  ansible.builtin.set_fact:
    mcpjungle_k8s_rendered_values: >-
      {{ (mcpjungle_k8s_rendered_values | default({})) | combine({
           'ingress': ((mcpjungle_k8s_rendered_values | default({})).get('ingress', {})
                       | combine({
                           'enabled': true,
                           'host': mcpjungle_k8s_connector_hostname,
                           'className': 'tailscale',
                           'tls': true,
                         }))
         }, recursive=true) }}
  tags: [mcpjungle, k8s, expose]

- name: Reconcile the Helm release with the operator-managed ingress
  kubernetes.core.helm:
    kubeconfig: "{{ mcpjungle_k8s_kubeconfig }}"
    context: "{{ mcpjungle_k8s_context }}"
    name: "{{ mcpjungle_k8s_release_name }}"
    chart_ref: "{{ role_path }}/../../charts/mcpjungle"
    release_namespace: "{{ mcpjungle_k8s_namespace }}"
    wait: true
    timeout: "{{ mcpjungle_k8s_timeout }}s"
    atomic: true
    cleanup_on_fail: true
    state: present
    values: "{{ mcpjungle_k8s_rendered_values }}"
  register: mcpjungle_k8s_release_exposed
  no_log: true
  diff: false
  tags: [mcpjungle, k8s, expose]

# Never assert a DNS name or address that was not observed.
- name: Read back the operator-assigned proxy hostname
  kubernetes.core.k8s_info:
    kubeconfig: "{{ mcpjungle_k8s_kubeconfig }}"
    context: "{{ mcpjungle_k8s_context }}"
    api_version: networking.k8s.io/v1
    kind: Ingress
    namespace: "{{ mcpjungle_k8s_namespace }}"
    name: "{{ mcpjungle_k8s_release_name }}"
    wait: true
    wait_timeout: "{{ mcpjungle_k8s_timeout | int }}"
  register: mcpjungle_k8s_ingress_info
  retries: "{{ mcpjungle_k8s_ingress_retries }}"
  delay: 10
  until:
    - (mcpjungle_k8s_ingress_info.resources | default([]) | length) > 0
  tags: [mcpjungle, k8s, expose]

- name: Report the tailnet identity actually assigned by the operator
  ansible.builtin.debug:
    msg:
      - "requested hostname (service name): {{ mcpjungle_k8s_connector_hostname }}"
      - "operator-assigned tailnet hostname: {{ mcpjungle_k8s_ingress_info.resources | default([]) | first | json_query('status.loadBalancer.ingress[0].hostname') | default('not-yet-reported', true) }}"
      - "backend service: {{ mcpjungle_k8s_service_dns }}:{{ mcpjungle_k8s_service_port }}"
  tags: [mcpjungle, k8s, expose]
