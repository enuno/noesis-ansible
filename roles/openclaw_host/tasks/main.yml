---
# roles/openclaw_host/tasks/main.yml
# Host install of upstream OpenClaw via the vendor install.sh.

- name: Validate OpenClaw host inputs offline
  ansible.builtin.assert:
    that:
      - openclaw_host_version is match('^[0-9]{4}\.[0-9]+\.[0-9]+$')
      - openclaw_host_install_url is match('^https://')
      - openclaw_host_install_method in ['npm', 'git']
      - openclaw_host_user is match('^[a-z_][a-z0-9_-]*$')
      - openclaw_host_home is match('^/')
      - openclaw_host_state_dir is match('^/')
      - openclaw_host_env_file is match('^/')
      - openclaw_host_gateway_port | int > 0
      - openclaw_host_gateway_port | int < 65536
      # Keep the same fail-closed contract the Kubernetes path uses.
      - openclaw_host_gateway_bind in ['loopback', 'lan', 'tailnet', 'custom', 'auto']
      - openclaw_host_gateway_auth_mode == 'token'
      - openclaw_host_service_name is match('^[a-zA-Z0-9._-]+$')
    fail_msg: OpenClaw host inputs failed closed offline validation.

- name: Refuse to run live without an explicit opt-in
  ansible.builtin.assert:
    that:
      - openclaw_host_live_changes | bool
    fail_msg: >-
      Set openclaw_host_live_changes=true to install on this host. This run
      downloads and executes the vendor install.sh and manages a systemd unit.
  when: not ansible_check_mode

- name: Ensure the service account exists
  ansible.builtin.user:
    name: "{{ openclaw_host_user }}"
    group: "{{ openclaw_host_group }}"
    home: "{{ openclaw_host_home }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: true
  become: true

- name: Ensure state and config directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ openclaw_host_user }}"
    group: "{{ openclaw_host_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ openclaw_host_state_dir }}", mode: "0750" }
    - { path: "{{ openclaw_host_env_file | dirname }}", mode: "0750" }
  become: true

# The env file carries OPENCLAW_GATEWAY_TOKEN. It is provisioned OUT OF BAND
# (escrow -> deliver), exactly as the Kubernetes path uses a pre-existing
# Secret. This role reads it and never writes a credential.
- name: Require the pre-provisioned gateway environment file
  ansible.builtin.stat:
    path: "{{ openclaw_host_env_file }}"
  register: openclaw_host_envfile_stat
  become: true

- name: Refuse to start without the gateway token file
  ansible.builtin.assert:
    that:
      - openclaw_host_envfile_stat.stat.exists
    fail_msg: >-
      {{ openclaw_host_env_file }} is absent. Provision it out of band with
      OPENCLAW_GATEWAY_TOKEN=<value> (mode 0600, owner {{ openclaw_host_user }});
      this role never generates or inlines credentials.
  when: not ansible_check_mode

- name: Check whether the pinned version is already installed
  ansible.builtin.command:
    argv:
      - "{{ openclaw_host_home }}/.local/bin/openclaw"
      - --version
  register: openclaw_host_current
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ openclaw_host_user }}"

# Fetch and inspect before executing: piping a remote script straight into a
# shell gives no opportunity to pin or review what actually runs.
- name: Stage the vendor installer
  ansible.builtin.get_url:
    url: "{{ openclaw_host_install_url }}"
    dest: /opt/openclaw/install.sh
    mode: "0750"
    owner: "{{ openclaw_host_user }}"
    group: "{{ openclaw_host_group }}"
  become: true
  when: openclaw_host_version not in (openclaw_host_current.stdout | default(''))

- name: Run the vendor installer non-interactively
  ansible.builtin.command:
    argv: >-
      {{ ['/bin/bash', '/opt/openclaw/install.sh']
         + openclaw_host_installer_args
         + ['--install-method', openclaw_host_install_method,
            '--version', openclaw_host_version] }}
  environment:
    HOME: "{{ openclaw_host_home }}"
    OPENCLAW_HOME: "{{ openclaw_host_home }}"
    OPENCLAW_STATE_DIR: "{{ openclaw_host_state_dir }}"
  register: openclaw_host_install_run
  changed_when: openclaw_host_install_run.rc == 0
  become: true
  become_user: "{{ openclaw_host_user }}"
  when: openclaw_host_version not in (openclaw_host_current.stdout | default(''))
  notify: Restart openclaw gateway

- name: Render the gateway configuration
  ansible.builtin.template:
    src: openclaw.json.j2
    dest: "{{ openclaw_host_config_path }}"
    owner: "{{ openclaw_host_user }}"
    group: "{{ openclaw_host_group }}"
    mode: "0640"
  become: true
  notify: Restart openclaw gateway

- name: Install the systemd unit
  ansible.builtin.template:
    src: openclaw-gateway.service.j2
    dest: "/etc/systemd/system/{{ openclaw_host_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd
    - Restart openclaw gateway

- name: Flush handlers so verification sees the running service
  ansible.builtin.meta: flush_handlers

- name: Ensure the gateway service is running
  ansible.builtin.systemd:
    name: "{{ openclaw_host_service_name }}"
    enabled: "{{ openclaw_host_service_enabled | bool }}"
    state: "{{ openclaw_host_service_state }}"
    daemon_reload: true
  become: true

# Assert the JSON body, not just the status code: the Control UI answers 200
# on unknown paths, so a status-only check passes against a broken gateway.
- name: Verify the gateway answers its liveness probe
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openclaw_host_gateway_port }}/healthz"
    return_content: true
  register: openclaw_host_health
  retries: 20
  delay: 5
  until:
    - openclaw_host_health.status is defined
    - openclaw_host_health.status == 200
    - (openclaw_host_health.json | default({})).ok | default(false) | bool
  when: not ansible_check_mode

- name: Report the verified host deployment
  ansible.builtin.debug:
    msg: >-
      OpenClaw {{ openclaw_host_version }} is running as
      {{ openclaw_host_service_name }}, bound {{ openclaw_host_gateway_bind }}
      on port {{ openclaw_host_gateway_port }}.
  when: not ansible_check_mode
