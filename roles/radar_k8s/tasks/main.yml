---
# Radar on k3s with private Tailscale operator ingress.
#
# Ordering: validate -> namespace -> chart provenance -> helm -> dedicated
# Tailscale Ingress -> readiness -> tailnet HTTPS health.
# No secrets escrow: auth.mode=none behind the tailnet boundary; the chart
# does not require operator-supplied credentials for the default path.

- name: Validate Radar deployment inputs
  ansible.builtin.assert:
    that:
      - radar_k8s_kubeconfig | length > 0
      - radar_k8s_context | length > 0
      - radar_k8s_hostname is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - radar_k8s_hostname not in radar_k8s_reserved_hostnames
      - radar_k8s_tailscale_ingress_class == 'tailscale'
      - radar_k8s_auth_mode in ['none', 'proxy', 'oidc']
      - radar_k8s_service_port | int == 9280
      - radar_k8s_chart_version == radar_k8s_app_version
      - radar_k8s_image_tag == radar_k8s_app_version
      - radar_k8s_timeline_storage in ['memory', 'sqlite', 'postgres']
    fail_msg: >-
      Target, hostname, ingress class, auth mode, port, or version pins are
      invalid. This role deploys single-replica Radar behind the tailscale
      IngressClass only.
  tags: [radar, k8s]

- name: Verify target kubeconfig exists
  ansible.builtin.stat:
    path: "{{ radar_k8s_kubeconfig }}"
  register: radar_k8s_kubeconfig_stat
  tags: [radar, k8s]

- name: Require target kubeconfig
  ansible.builtin.assert:
    that: radar_k8s_kubeconfig_stat.stat.exists
    fail_msg: "Kubeconfig {{ radar_k8s_kubeconfig }} is not present on the managed host."
  tags: [radar, k8s]

- name: Create the radar namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ radar_k8s_kubeconfig }}"
    context: "{{ radar_k8s_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ radar_k8s_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible-radar-k8s
  tags: [radar, k8s]

- name: Read the vendored chart metadata on the controller
  ansible.builtin.slurp:
    src: "{{ radar_k8s_chart_ref }}/Chart.yaml"
  delegate_to: localhost
  become: false
  run_once: true
  register: radar_k8s_chart_yaml_b64
  tags: [radar, k8s]

- name: Require the pinned chart version and appVersion
  ansible.builtin.assert:
    that:
      - (radar_k8s_chart_yaml_b64.content | b64decode | from_yaml).version == radar_k8s_chart_version
      - (radar_k8s_chart_yaml_b64.content | b64decode | from_yaml).appVersion | string == radar_k8s_app_version
      - (radar_k8s_chart_yaml_b64.content | b64decode | from_yaml).name == 'radar'
    fail_msg: >-
      charts/vendor/radar drifted from the approved pin: expected radar
      {{ radar_k8s_chart_version }} / appVersion {{ radar_k8s_app_version }}
      (see VENDORED.md).
  tags: [radar, k8s]

- name: Render values, reconcile the release, and always clean up
  block:
    - name: Render Radar Helm values on the target
      ansible.builtin.template:
        src: values.yml.j2
        dest: /run/radar-values.yml
        mode: '0600'
      check_mode: false
      changed_when: false
      tags: [radar, k8s]

    - name: Install or upgrade the Radar Helm release
      kubernetes.core.helm:
        kubeconfig: "{{ radar_k8s_kubeconfig }}"
        context: "{{ radar_k8s_context }}"
        name: "{{ radar_k8s_release_name }}"
        chart_ref: "{{ radar_k8s_chart_ref }}"
        release_namespace: "{{ radar_k8s_namespace }}"
        create_namespace: false
        values_files:
          - /run/radar-values.yml
        wait: true
        timeout: "{{ radar_k8s_helm_timeout }}s"
        atomic: true
        cleanup_on_fail: true
        state: present
      register: radar_k8s_helm_result
      tags: [radar, k8s]
  always:
    - name: Remove the rendered values from the target
      ansible.builtin.file:
        path: /run/radar-values.yml
        state: absent
      check_mode: false
      changed_when: false
      tags: [radar, k8s]

- name: Probe the namespace for the check-mode ingress preview
  kubernetes.core.k8s_info:
    kubeconfig: "{{ radar_k8s_kubeconfig }}"
    context: "{{ radar_k8s_context }}"
    api_version: v1
    kind: Namespace
    name: "{{ radar_k8s_namespace }}"
  register: radar_k8s_ns_probe
  changed_when: false
  when: ansible_check_mode
  tags: [radar, k8s, expose]

- name: Explain the skipped ingress preview on first-deploy check runs
  ansible.builtin.debug:
    msg: >-
      check mode: skipping the Ingress server-side dry-run — the
      {{ radar_k8s_namespace }} namespace does not exist yet and the API cannot
      validate namespaced objects into it.
  when:
    - ansible_check_mode
    - radar_k8s_ns_probe.resources | default([]) | length == 0
  tags: [radar, k8s, expose]

- name: Apply the dedicated operator-managed Tailscale Ingress
  kubernetes.core.k8s:
    kubeconfig: "{{ radar_k8s_kubeconfig }}"
    context: "{{ radar_k8s_context }}"
    state: present
    apply: true
    definition: "{{ lookup('template', 'ingress.yml.j2') | from_yaml }}"
  when:
    - not ansible_check_mode or radar_k8s_ns_probe.resources | default([]) | length == 1
  tags: [radar, k8s, expose]

- name: Wait for the operator to publish the tailnet hostname
  kubernetes.core.k8s_info:
    kubeconfig: "{{ radar_k8s_kubeconfig }}"
    context: "{{ radar_k8s_context }}"
    api_version: networking.k8s.io/v1
    kind: Ingress
    namespace: "{{ radar_k8s_namespace }}"
    name: "{{ radar_k8s_release_name }}"
  register: radar_k8s_ingress
  retries: 36
  delay: 10
  until:
    - radar_k8s_ingress.resources | length == 1
    - radar_k8s_ingress.resources[0].status.loadBalancer.ingress | default([]) | length > 0
  when: not ansible_check_mode
  tags: [radar, k8s, expose]

- name: Assert the tailnet hostname matches the configured Radar hostname
  ansible.builtin.assert:
    that:
      - radar_k8s_ingress.resources[0].status.loadBalancer.ingress[0].hostname
        == radar_k8s_hostname ~ '.' ~ radar_k8s_tailnet_domain
    fail_msg: >-
      Tailscale published a different hostname than expected. Reconcile
      radar_k8s_hostname with the operator-published endpoint before continuing.
  when: not ansible_check_mode
  tags: [radar, k8s, expose]

- name: Wait for the Radar deployment to become available
  kubernetes.core.k8s_info:
    kubeconfig: "{{ radar_k8s_kubeconfig }}"
    context: "{{ radar_k8s_context }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ radar_k8s_namespace }}"
    name: "{{ radar_k8s_release_name }}"
  register: radar_k8s_deployment
  retries: 60
  delay: 10
  until:
    - radar_k8s_deployment.resources | length == 1
    - radar_k8s_deployment.resources[0].status.availableReplicas | default(0) | int >= 1
  when: not ansible_check_mode
  tags: [radar, k8s]

- name: Wait for populated Radar Service endpoints
  kubernetes.core.k8s_info:
    kubeconfig: "{{ radar_k8s_kubeconfig }}"
    context: "{{ radar_k8s_context }}"
    api_version: v1
    kind: Endpoints
    namespace: "{{ radar_k8s_namespace }}"
    name: "{{ radar_k8s_release_name }}"
  register: radar_k8s_endpoints
  retries: 24
  delay: 10
  until:
    - radar_k8s_endpoints.resources | length == 1
    - radar_k8s_endpoints.resources[0].subsets | default([]) | length > 0
    - radar_k8s_endpoints.resources[0].subsets[0].addresses | default([]) | length > 0
  when: not ansible_check_mode
  tags: [radar, k8s]

- name: Wait for the operator's Radar ingress proxy pod
  kubernetes.core.k8s_info:
    kubeconfig: "{{ radar_k8s_kubeconfig }}"
    context: "{{ radar_k8s_context }}"
    api_version: v1
    kind: Pod
    namespace: tailscale
  register: radar_k8s_ts_pods
  retries: 36
  delay: 10
  until:
    - (radar_k8s_ts_pods.resources
       | selectattr('metadata.name', 'match', '^ts-radar-') | list | length) >= 1
    - ((radar_k8s_ts_pods.resources
        | selectattr('metadata.name', 'match', '^ts-radar-') | list)[0].status.phase) == 'Running'
    - ((radar_k8s_ts_pods.resources
        | selectattr('metadata.name', 'match', '^ts-radar-') | list)[0].status.containerStatuses
        | default([]) | selectattr('ready', 'equalto', true) | list | length) >= 1
  when: not ansible_check_mode
  tags: [radar, k8s, expose]

- name: Check the Radar health endpoint over tailnet HTTPS
  ansible.builtin.uri:
    url: "https://{{ radar_k8s_hostname }}.{{ radar_k8s_tailnet_domain }}/api/health"
    method: GET
    status_code: 200
    timeout: 30
  register: radar_k8s_health
  retries: 24
  delay: 15
  until: radar_k8s_health.status == 200
  changed_when: false
  when: not ansible_check_mode
  tags: [radar, k8s, verify]

- name: Check the Radar UI loads over tailnet HTTPS
  ansible.builtin.uri:
    url: "https://{{ radar_k8s_hostname }}.{{ radar_k8s_tailnet_domain }}/"
    method: GET
    status_code: 200
    return_content: true
    timeout: 30
  register: radar_k8s_ui
  retries: 12
  delay: 15
  until: radar_k8s_ui.status == 200
  changed_when: false
  when: not ansible_check_mode
  tags: [radar, k8s, verify]

- name: Read the deployed release summary (no values)
  ansible.builtin.command:
    argv:
      - /usr/local/bin/helm
      - list
      - -n
      - "{{ radar_k8s_namespace }}"
      - --filter
      - "^{{ radar_k8s_release_name }}$"
      - -o
      - json
  environment:
    KUBECONFIG: "{{ radar_k8s_kubeconfig }}"
  register: radar_k8s_release_summary
  changed_when: false
  failed_when: radar_k8s_release_summary.rc != 0
  when: not ansible_check_mode
  tags: [radar, k8s]

- name: Summarize the deployed release
  ansible.builtin.set_fact:
    radar_k8s_release_brief: >-
      {{ (radar_k8s_release_summary.stdout | from_json)[0] | default({})
         | json_query('{name: name, revision: revision, status: status, chart: chart, app_version: app_version}') }}
  when: not ansible_check_mode
  tags: [radar, k8s]

- name: Report the deployment summary
  ansible.builtin.debug:
    msg:
      - "release: {{ radar_k8s_release_brief }}"
      - "endpoint: https://{{ radar_k8s_hostname }}.{{ radar_k8s_tailnet_domain }}"
      - "auth.mode: {{ radar_k8s_auth_mode }} (tailnet trust boundary)"
  when: not ansible_check_mode
  tags: [radar, k8s]
