---
# roles/hermes_profiles/tasks/configure.yml
# Run each ENABLED fleet's roster-driven apply script against the target
# Hermes home. Selector dialect differs per script (documented in the fleet
# var): noesis takes --all (mode=all) or nothing (mode=wave1, the script
# default); agency takes --all or --wave N. --yes is mandatory under Ansible
# (no TTY for the interactive confirmation).

- name: Build per-fleet apply args
  ansible.builtin.set_fact:
    hp_apply_args: >-
      {{ hp_apply_args | default({}) | combine({
           item.key: (
             '--home ' ~ (hermes_profiles_home | quote) ~ ' '
             ~ ('--all' if (item.value.mode == 'all')
                else ('' if item.key == 'noesis'
                      else '--wave ' ~ (item.value.mode | regex_replace('wave', ''))))
             ~ (' --yes' if item.key == 'agency' else '')
             ~ ('' if (item.value.get('tune_models', true) | bool) else ' --no-model-tuning')
             ~ ((' ' ~ item.value.want_flag ~ ' '
                 ~ (item.value.get('want', []) | join(' ' ~ item.value.want_flag ~ ' ')))
                if item.value.get('want', []) | length > 0 else '')
           )
         }) }}
  loop: "{{ hp_fleets_enabled | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Apply enabled fleets
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      HERMES_HOME={{ hermes_profiles_home | quote }}
      {{ (hermes_profiles_stage_dir ~ '/' ~ item.value.apply_script) | quote }} {{ hp_apply_args[item.key] }}
      | tee {{ hermes_profiles_stage_dir | quote }}/apply-{{ item.key }}.log
  register: hp_apply
  changed_when: "'created=' in hp_apply.stdout"
  failed_when: "'Failed:' in hp_apply.stdout"
  environment:
    PATH: "{{ ansible_env.PATH }}:/usr/local/bin:{{ ansible_env.HOME }}/.local/bin"
  loop: "{{ hp_fleets_enabled | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
