---
# roles/hermes_profiles/tasks/configure.yml
# Run the idempotent apply script against the target Hermes home.

- name: Build apply args
  ansible.builtin.set_fact:
    hp_apply_args: >-
      --home {{ hermes_profiles_home }}
      --{{ 'all' if hermes_profiles_mode == 'all' else 'wave1' }}

- name: Add no-model-tuning flag when requested
  ansible.builtin.set_fact:
    hp_apply_args: "{{ hp_apply_args }} --no-model-tuning"
  when: not (hermes_profiles_tune_models | bool)

- name: Add profile filter when a subset is requested
  ansible.builtin.set_fact:
    hp_apply_args: "{{ hp_apply_args }}{% for p in hermes_profiles_want %} --profile {{ p }}{% endfor %}"
  when: hermes_profiles_want | length > 0

- name: Apply Noesis profile fleet
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      NOESIS_STACK_DIR={{ hermes_profiles_stage_dir | quote }}
      HERMES_HOME={{ hermes_profiles_home | quote }}
      {{ hermes_profiles_stage_dir | quote }}/apply-noesis-profiles.sh {{ hp_apply_args }}
      | tee {{ hermes_profiles_stage_dir | quote }}/apply.log
  register: hp_apply
  changed_when: "'created=' in hp_apply.stdout"
  failed_when: "'Failed:' in hp_apply.stdout"
  environment:
    PATH: "{{ ansible_env.PATH }}:/usr/local/bin:{{ ansible_env.HOME }}/.local/bin"
