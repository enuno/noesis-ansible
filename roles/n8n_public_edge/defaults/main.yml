---
# Public HTTPS edge for the k3s n8n release: nginx on this host terminating TLS
# for a Cloudflare-proxied name, with a Let's Encrypt certificate issued over
# the Cloudflare DNS-01 challenge.
#
# POLICY NOTE. docs/praxis-k3s/k3s.md records the standing decision that
# "nothing on this host may expose public HTTP(S) listeners", which is why k3s
# runs with traefik and servicelb disabled. This role is the explicit,
# owner-approved exception to that line for one hostname. It is default-OFF and
# the playbook refuses to run it unless the site opts in, so the policy still
# holds everywhere it has not been deliberately waived.
#
# Why host nginx rather than an in-cluster ingress controller: servicelb is
# disabled and services are ClusterIP-only by policy, so there is no
# LoadBalancer path to 80/443. The node reaches the n8n ClusterIP directly, so a
# host reverse proxy needs no new cluster-level exposure.
n8n_public_edge_enabled: false

# Public name served here. Must be fully qualified and must match the
# certificate and the Cloudflare record.
n8n_public_edge_fqdn: n8n.hashgrid.net
# Address clients reach this origin on, recorded so the runbook and the
# verification agree on what DNS should point at.
n8n_public_edge_origin_ip: 31.97.209.57

# ---- upstream (the k3s n8n Service) ----
n8n_public_edge_upstream_namespace: n8n
n8n_public_edge_upstream_service: n8n-main
n8n_public_edge_upstream_port: 5678
# Resolved from the live Service at deploy time rather than hardcoded. A
# ClusterIP is stable for the life of the Service but is NOT an address to
# assume: re-running the play repairs it if the Service is ever recreated, and
# the post-deploy check fails loudly if nginx cannot reach it.
n8n_public_edge_upstream_ip: ""

# ---- TLS / ACME ----
n8n_public_edge_cert_dir: /etc/letsencrypt/live/{{ n8n_public_edge_fqdn }}
n8n_public_edge_acme_email: elvis@hashgrid.net
# Let's Encrypt staging. Use it to rehearse: production has a duplicate-certificate
# rate limit, and a loop of failed real issuances is the usual way to hit it.
n8n_public_edge_acme_staging: false
# Cloudflare DNS-01. The token needs Zone.DNS:Edit on this zone only; the
# pre-existing CLOUDFLARE_API_KEY record carries Zone:Read and is REFUSED on
# DNS records (API code 10000), so it cannot serve this challenge.
n8n_public_edge_cloudflare_bw_key: N8N_K3S_DEFAULT_CLOUDFLARE_DNS_TOKEN
n8n_public_edge_cloudflare_credentials_path: /etc/letsencrypt/cloudflare-{{ n8n_public_edge_fqdn }}.ini
# Cloudflare's DNS-01 TXT record has to propagate to the ACME validators before
# certbot asks for validation; the plugin's 10s default is optimistic.
n8n_public_edge_acme_propagation_seconds: 45
n8n_public_edge_bws_path: /usr/local/bin/bws
n8n_public_edge_bws_access_token: ""
n8n_public_edge_bitwarden_project_id: "72974d0e-81af-4678-bab7-b46000985859"

# ---- nginx ----
n8n_public_edge_packages:
  - nginx
  - certbot
  - python3-certbot-dns-cloudflare
n8n_public_edge_site_name: n8n-public
# n8n accepts ANY Host header (verified: an unrelated Host still returns 200),
# so it provides no virtual-host isolation of its own. nginx therefore owns
# that boundary with a catch-all server that drops anything which is not the
# expected name.
n8n_public_edge_reject_unknown_host: true
# Editor file uploads and workflow imports exceed nginx's 1m default.
n8n_public_edge_client_max_body_size: 100m
# n8n holds long-lived connections for the editor push channel and for
# long-running executions. A short read timeout shows up as the UI
# disconnecting mid-run rather than as an error.
n8n_public_edge_proxy_read_timeout: 3600s
n8n_public_edge_hsts_enabled: true
n8n_public_edge_hsts_value: "max-age=31536000; includeSubDomains"

# ---- firewall ----
# The name is Cloudflare-proxied, so only Cloudflare needs to reach 80/443.
# Leaving the origin open to the internet would let anyone bypass Cloudflare by
# hitting the IP directly with the right Host header - and n8n does not check
# Host, so that bypass would reach the application.
n8n_public_edge_restrict_to_cloudflare: true
n8n_public_edge_firewall_comment: "n8n public edge (Cloudflare origin)"
# Vendored from https://api.cloudflare.com/client/v4/ips so the firewall is
# reproducible from the repo and every change is a reviewable diff rather than
# whatever the API returned on the day. Refresh with
# `scripts/refresh_cloudflare_ips.py` (see the runbook) and commit the result.
n8n_public_edge_cloudflare_ips_etag: "38f79d050aa027e3be3865e495dcc9bc"
n8n_public_edge_cloudflare_ipv4:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
n8n_public_edge_cloudflare_ipv6:
  - "2400:cb00::/32"
  - "2606:4700::/32"
  - "2803:f800::/32"
  - "2405:b500::/32"
  - "2405:8100::/32"
  - "2a06:98c0::/29"
  - "2c0f:f248::/32"
