---
- name: Validate pinned LibreChat chart and explicit cluster target
  ansible.builtin.assert:
    that:
      - librechat_helm_chart_ref == 'oci://ghcr.io/librechat-ai/librechat-chart/librechat'
      - librechat_helm_chart_version == '2.0.17'
      - librechat_helm_image_tag == 'v0.8.8'
      - librechat_helm_kubeconfig is match('^/')
      - librechat_helm_context | length > 0
      - librechat_helm_namespace is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - librechat_helm_release is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - librechat_helm_secret | length > 0
      - librechat_helm_meili_secret | length > 0
      - librechat_helm_meili_secret != librechat_helm_secret
      - librechat_helm_uploads_size is match('^[1-9][0-9]*(Mi|Gi|Ti)$')
      - librechat_helm_ingress is mapping
      - not (librechat_helm_ingress.enabled | default(false) | bool) or
        ((librechat_helm_ingress.className | default('') | length > 0) and
         (librechat_helm_ingress.hosts | default([]) | length > 0) and
         (librechat_helm_ingress.hosts[0].host | default('') not in ['', 'chat.example.com']) and
         ((librechat_helm_ingress.className | default('')) == 'tailscale' or
          (librechat_helm_ingress.tls | default([]) | length > 0)))
    fail_msg: >-
      Pin LibreChat v0.8.8 / chart 2.0.17, specify kubeconfig and context,
      and set a real ingress class and hostname if enabling exposure.
- name: Validate every enabled ingress host, TLS binding, and path
  ansible.builtin.assert:
    that:
      - item.host is match('^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$')
      - item.host != 'chat.example.com'
      - item.paths is sequence
      - item.paths | length > 0
      - (librechat_helm_ingress.className == 'tailscale') or
        (item.host in (librechat_helm_ingress.tls | default([]) | map(attribute='hosts', default=[]) | flatten))
    fail_msg: Each ingress host needs a real hostname, paths and TLS coverage (or Tailscale TLS).
  loop: "{{ librechat_helm_ingress.hosts | default([]) }}"
  when: librechat_helm_ingress.enabled | default(false) | bool
- name: Validate every enabled ingress path
  ansible.builtin.assert:
    that:
      - item.1.path | default('') | length > 0
      - item.1.pathType | default('') in ['Prefix', 'Exact', 'ImplementationSpecific']
  loop: "{{ librechat_helm_ingress.hosts | default([]) | subelements('paths') }}"
  when: librechat_helm_ingress.enabled | default(false) | bool
- name: Refuse live Kubernetes changes without explicit opt-in
  ansible.builtin.assert:
    that: librechat_helm_live_changes | bool
    fail_msg: Set librechat_helm_live_changes=true for the approved target only.
  when: not ansible_check_mode
- name: Check that the target has a readable kubeconfig
  ansible.builtin.stat:
    path: "{{ librechat_helm_kubeconfig }}"
  register: librechat_helm_kubeconfig_stat
- name: Require the kubeconfig on the target host
  ansible.builtin.assert:
    that: librechat_helm_kubeconfig_stat.stat.isreg | default(false)
    fail_msg: The target kubeconfig is absent or inaccessible.
  when: not ansible_check_mode
- name: Read kubeconfig context names
  ansible.builtin.slurp:
    src: "{{ librechat_helm_kubeconfig }}"
  register: librechat_helm_kubeconfig_raw
  no_log: true
  when: not ansible_check_mode
- name: Refuse a context not present in the kubeconfig
  ansible.builtin.assert:
    that:
      - librechat_helm_context in (((librechat_helm_kubeconfig_raw.content | b64decode | from_yaml).get('contexts') or []) | map(attribute='name') | list)
    fail_msg: The specified kube context does not exist in this kubeconfig.
  when: not ansible_check_mode
- name: Check that Helm is installed on the target
  ansible.builtin.stat:
    path: "{{ librechat_helm_binary }}"
  register: librechat_helm_binary_stat
- name: Require Helm on the target
  ansible.builtin.assert:
    that:
      - librechat_helm_binary_stat.stat.exists
      - librechat_helm_binary_stat.stat.executable
    fail_msg: Install Helm on the target before deployment.
  when: not ansible_check_mode
- name: Look up the already provisioned LibreChat credentials
  kubernetes.core.k8s_info:
    kubeconfig: "{{ librechat_helm_kubeconfig }}"
    context: "{{ librechat_helm_context }}"
    api_version: v1
    kind: Secret
    namespace: "{{ librechat_helm_namespace }}"
    name: "{{ librechat_helm_secret }}"
  register: librechat_helm_credentials
  no_log: true
  when: not ansible_check_mode
- name: Fail closed on missing or empty credential keys
  ansible.builtin.assert:
    that:
      - librechat_helm_credentials.resources | length == 1
      - (librechat_helm_credentials.resources[0].data | default({})).get('CREDS_KEY', '') | length > 0
      - (librechat_helm_credentials.resources[0].data | default({})).get('CREDS_IV', '') | length > 0
      - (librechat_helm_credentials.resources[0].data | default({})).get('JWT_SECRET', '') | length > 0
      - (librechat_helm_credentials.resources[0].data | default({})).get('JWT_REFRESH_SECRET', '') | length > 0
      - (librechat_helm_credentials.resources[0].data | default({})).get('MEILI_MASTER_KEY', '') | length > 0
    fail_msg: >-
      Provision the existing Secret with CREDS_KEY, CREDS_IV, JWT_SECRET,
      JWT_REFRESH_SECRET and MEILI_MASTER_KEY before Helm installation.
  no_log: true
  when: not ansible_check_mode
- name: Look up the separately provisioned Meilisearch key
  kubernetes.core.k8s_info:
    kubeconfig: "{{ librechat_helm_kubeconfig }}"
    context: "{{ librechat_helm_context }}"
    api_version: v1
    kind: Secret
    namespace: "{{ librechat_helm_namespace }}"
    name: "{{ librechat_helm_meili_secret }}"
  register: librechat_helm_meili_credentials
  no_log: true
  when: not ansible_check_mode
- name: Fail closed on missing or overbroad Meilisearch Secret
  ansible.builtin.assert:
    that:
      - librechat_helm_meili_credentials.resources | length == 1
      - (librechat_helm_meili_credentials.resources[0].data | default({}) | dict2items | map(attribute='key') | list) == ['MEILI_MASTER_KEY']
      - (librechat_helm_meili_credentials.resources[0].data | default({})).get('MEILI_MASTER_KEY', '') | length > 0
      - >-
        (librechat_helm_meili_credentials.resources[0].data | default({})).get('MEILI_MASTER_KEY', '') ==
        (librechat_helm_credentials.resources[0].data | default({})).get('MEILI_MASTER_KEY', '')
    fail_msg: Provision a separate Secret containing ONLY MEILI_MASTER_KEY.
  no_log: true
  when: not ansible_check_mode
