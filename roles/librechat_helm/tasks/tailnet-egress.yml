---
# The operator owns the proxy and rewrites externalName; Ansible owns only the
# declared target Service. No egress resources are touched with the default [].
- name: Validate tailnet egress options
  ansible.builtin.assert:
    that:
      - librechat_helm_tailnet_egress_services is sequence
      - librechat_helm_tailnet_egress_services is not string
      - librechat_helm_tailnet_egress_proxy_group is string
      - librechat_helm_tailnet_egress_proxy_group == '' or
        (librechat_helm_tailnet_egress_proxy_group | length <= 63 and
         librechat_helm_tailnet_egress_proxy_group is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'))
      - librechat_helm_tailnet_operator_namespace is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - librechat_helm_tailnet_operator_deployment is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    fail_msg: Tailnet egress needs a list, DNS-safe operator coordinates and an egress ProxyGroup name (if set).

- name: Validate each tailnet target and declared port
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.name | default('') is string
      - item.name | default('') | length <= 63
      - item.name | default('') is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - item.target_fqdn | default('') | length <= 253
      - item.target_fqdn | default('') is match('^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?(?:[.][a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?)+[.]ts[.]net$')
      - item.port | default(none) is integer
      - item.port | default(0) | int >= 1
      - item.port | default(0) | int <= 65535
    fail_msg: Use a unique DNS-safe Service name, a full device.tailnet.ts.net FQDN and a TCP port (1-65535).
  loop: "{{ librechat_helm_tailnet_egress_services }}"
  loop_control:
    label: "{{ item.name | default('invalid target') }}"

- name: Require unique tailnet egress Service names
  ansible.builtin.assert:
    that:
      - (librechat_helm_tailnet_egress_services | map(attribute='name') | list | unique | length) ==
        (librechat_helm_tailnet_egress_services | length)
    fail_msg: Tailnet egress Service names must be unique within the LibreChat namespace.

- name: Read the Tailscale operator Deployment before creating egress Services
  kubernetes.core.k8s_info:
    kubeconfig: "{{ librechat_helm_kubeconfig }}"
    context: "{{ librechat_helm_context }}"
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ librechat_helm_tailnet_operator_namespace }}"
    name: "{{ librechat_helm_tailnet_operator_deployment }}"
  register: librechat_helm_tailnet_operator_info
  when:
    - not ansible_check_mode
    - librechat_helm_tailnet_egress_services | length > 0

- name: Refuse egress changes if the Tailscale operator is unavailable
  ansible.builtin.assert:
    that:
      - librechat_helm_tailnet_operator_info.resources | length == 1
      - librechat_helm_tailnet_operator_info.resources[0].status.availableReplicas | default(0) | int >= 1
    fail_msg: Install and verify the Tailscale operator Deployment before creating egress Services.
  when:
    - not ansible_check_mode
    - librechat_helm_tailnet_egress_services | length > 0

- name: Look up the existing egress ProxyGroup, when shared HA is selected
  kubernetes.core.k8s_info:
    kubeconfig: "{{ librechat_helm_kubeconfig }}"
    context: "{{ librechat_helm_context }}"
    api_version: tailscale.com/v1alpha1
    kind: ProxyGroup
    name: "{{ librechat_helm_tailnet_egress_proxy_group }}"
  register: librechat_helm_tailnet_proxy_group_info
  when:
    - not ansible_check_mode
    - librechat_helm_tailnet_egress_services | length > 0
    - librechat_helm_tailnet_egress_proxy_group | length > 0

- name: Refuse a missing or non-egress ProxyGroup
  ansible.builtin.assert:
    that:
      - librechat_helm_tailnet_proxy_group_info.resources | length == 1
      - librechat_helm_tailnet_proxy_group_info.resources[0].spec.type == 'egress'
    fail_msg: Install the Tailscale operator and provision an egress-type ProxyGroup first.
  when:
    - not ansible_check_mode
    - librechat_helm_tailnet_egress_services | length > 0
    - librechat_helm_tailnet_egress_proxy_group | length > 0

- name: Read existing operator-managed egress Services before changing them
  kubernetes.core.k8s_info:
    kubeconfig: "{{ librechat_helm_kubeconfig }}"
    context: "{{ librechat_helm_context }}"
    api_version: v1
    kind: Service
    namespace: "{{ librechat_helm_namespace }}"
    name: "{{ item.name }}"
  loop: "{{ librechat_helm_tailnet_egress_services }}"
  loop_control:
    label: "{{ item.name }}"
  register: librechat_helm_tailnet_existing
  when: not ansible_check_mode

- name: Refuse to take ownership of an unrelated Service or change its proxy mode
  ansible.builtin.assert:
    that:
      - item.resources | length == 0 or
        (item.resources | length == 1 and
         item.resources[0].spec.type == 'ExternalName' and
         item.resources[0].spec.ports | default([]) | length == 1 and
         item.resources[0].spec.ports[0].port | int == item.item.port | int and
         item.resources[0].spec.ports[0].name | default('') == 'tcp' and
         item.resources[0].spec.ports[0].protocol | default('') == 'TCP' and
         item.resources[0].metadata.labels['app.kubernetes.io/managed-by'] | default('') == 'noesis-ansible' and
         item.resources[0].metadata.labels['app.kubernetes.io/instance'] | default('') == librechat_helm_release and
         item.resources[0].metadata.annotations['tailscale.com/tailnet-fqdn'] | default('') == item.item.target_fqdn and
         item.resources[0].metadata.annotations['tailscale.com/tailnet-ip'] | default('') == '' and
         item.resources[0].metadata.annotations['tailscale.com/ts-tailnet-target-ip'] | default('') == '' and
         item.resources[0].metadata.annotations['tailscale.com/proxy-group'] | default('') ==
           librechat_helm_tailnet_egress_proxy_group)
    fail_msg: An existing Service is foreign or differs in target, TCP port, or proxy mode; use a new Service name for migrations.
  loop: "{{ librechat_helm_tailnet_existing.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not ansible_check_mode

- name: Configure Tailscale operator egress Services
  kubernetes.core.k8s:
    kubeconfig: "{{ librechat_helm_kubeconfig }}"
    context: "{{ librechat_helm_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        namespace: "{{ librechat_helm_namespace }}"
        name: "{{ item.item.name }}"
        labels:
          app.kubernetes.io/managed-by: noesis-ansible
          app.kubernetes.io/instance: "{{ librechat_helm_release }}"
        annotations: >-
          {{ {'tailscale.com/tailnet-fqdn': item.item.target_fqdn} |
             combine(({'tailscale.com/proxy-group': librechat_helm_tailnet_egress_proxy_group}
                      if librechat_helm_tailnet_egress_proxy_group | length > 0 else {})) }}
      spec: >-
        {{ {'type': 'ExternalName',
            'ports': [{'name': 'tcp', 'port': item.item.port, 'protocol': 'TCP'}]} |
           combine(({'externalName': 'placeholder'} if item.resources | length == 0 else {})) }}
  loop: "{{ librechat_helm_tailnet_existing.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not ansible_check_mode

- name: Wait for the operator to reconcile each tailnet egress Service
  kubernetes.core.k8s_info:
    kubeconfig: "{{ librechat_helm_kubeconfig }}"
    context: "{{ librechat_helm_context }}"
    api_version: v1
    kind: Service
    namespace: "{{ librechat_helm_namespace }}"
    name: "{{ item.name }}"
  register: librechat_helm_tailnet_ready
  until: >-
    librechat_helm_tailnet_ready.resources | length == 1 and
    librechat_helm_tailnet_ready.resources[0].spec.externalName | default('placeholder') != 'placeholder' and
    (librechat_helm_tailnet_ready.resources[0].status.conditions | default([]) |
     selectattr('type', 'equalto', ('TailscaleEgressSvcReady' if librechat_helm_tailnet_egress_proxy_group | length > 0 else 'ProxyReady')) |
     selectattr('status', 'equalto', 'True') | list | length > 0)
  retries: 20
  delay: 15
  loop: "{{ librechat_helm_tailnet_egress_services }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode
