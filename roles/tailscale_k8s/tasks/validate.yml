---
# Post-migration validation. Reads only live state; safe to rerun.

- name: Read operator Deployment
  kubernetes.core.k8s_info:
    kubeconfig: "{{ tailscale_k8s_kubeconfig_path }}"
    api_version: apps/v1
    kind: Deployment
    name: "{{ tailscale_k8s_release_name }}"
    namespace: "{{ tailscale_k8s_namespace }}"
  register: tailscale_k8s_validate_operator

- name: Assert operator is ready
  ansible.builtin.assert:
    that:
      - tailscale_k8s_validate_operator.resources | length == 1
      - tailscale_k8s_validate_operator.resources[0].status.readyReplicas | default(0) >= 1
    fail_msg: "tailscale-operator Deployment is not ready in ns {{ tailscale_k8s_namespace }}."

- name: Read dashboard Ingress
  kubernetes.core.k8s_info:
    kubeconfig: "{{ tailscale_k8s_kubeconfig_path }}"
    api_version: networking.k8s.io/v1
    kind: Ingress
    name: "{{ tailscale_k8s_dashboard_hostname }}"
    namespace: "{{ tailscale_k8s_dashboard_backend_namespace }}"
  register: tailscale_k8s_validate_ingress

- name: Assert Ingress carries the expected tailnet hostname
  ansible.builtin.assert:
    that:
      - tailscale_k8s_validate_ingress.resources | length == 1
      - tailscale_k8s_validate_ingress.resources[0].status.loadBalancer.ingress | default([]) | length > 0
      - tailscale_k8s_validate_ingress.resources[0].status.loadBalancer.ingress[0].hostname | default('')
        == tailscale_k8s_dashboard_hostname ~ '.' ~ tailscale_k8s_tailnet_domain
    fail_msg: >-
      Ingress has not been assigned {{ tailscale_k8s_dashboard_hostname }}.{{ tailscale_k8s_tailnet_domain }}.
      Check the operator logs: k3s kubectl -n {{ tailscale_k8s_namespace }} logs deploy/{{ tailscale_k8s_release_name }}.
      Common cause: the MagicDNS name is still held by another device (host
      tailscaled not removed, or stale device in the admin console).

- name: Assert ingressClassName is tailscale (tailnet-only by construction)
  ansible.builtin.assert:
    that:
      - tailscale_k8s_validate_ingress.resources[0].spec.ingressClassName == 'tailscale'
    fail_msg: "Dashboard Ingress must use ingressClassName tailscale; anything else may expose the dashboard publicly."

- name: Assert host tailscaled is absent
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: tailscale_k8s_validate_host_binary

- name: Assert host tailscale fully removed
  ansible.builtin.assert:
    that:
      - not tailscale_k8s_validate_host_binary.stat.exists
    fail_msg: >-
      Host tailscale is still installed. Two tailscaled instances must never
      share the noesis-praxis identity. Run the remove-host phase.

- name: Read Hermes dashboard Service (still ClusterIP)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ tailscale_k8s_kubeconfig_path }}"
    api_version: v1
    kind: Service
    name: "{{ tailscale_k8s_dashboard_backend_service }}"
    namespace: "{{ tailscale_k8s_dashboard_backend_namespace }}"
  register: tailscale_k8s_validate_svc

- name: Assert dashboard Service remains private
  ansible.builtin.assert:
    that:
      - tailscale_k8s_validate_svc.resources | length == 1
      - tailscale_k8s_validate_svc.resources[0].spec.type == 'ClusterIP'
    fail_msg: "hermes-agent Service must remain ClusterIP; tailnet exposure comes only from the tailscale Ingress."

- name: Read in-cluster Tailscale DNSConfig
  kubernetes.core.k8s_info:
    kubeconfig: "{{ tailscale_k8s_kubeconfig_path }}"
    api_version: tailscale.com/v1alpha1
    kind: DNSConfig
    name: "{{ tailscale_k8s_dnsconfig_name }}"
  register: tailscale_k8s_validate_dnsconfig
  when: "'dns' in tailscale_k8s_actions"

- name: Assert in-cluster MagicDNS nameserver is ready
  ansible.builtin.assert:
    that:
      - tailscale_k8s_validate_dnsconfig.resources | length == 1
      - tailscale_k8s_validate_dnsconfig.resources[0].status.nameserver.ip | default('') | length > 0
    fail_msg: "Tailscale DNSConfig has no ready nameserver Service IP."
  when: "'dns' in tailscale_k8s_actions"

- name: Read k3s CoreDNS custom import ConfigMap
  kubernetes.core.k8s_info:
    kubeconfig: "{{ tailscale_k8s_kubeconfig_path }}"
    api_version: v1
    kind: ConfigMap
    namespace: "{{ tailscale_k8s_dns_coredns_namespace }}"
    name: "{{ tailscale_k8s_dns_coredns_configmap }}"
  register: tailscale_k8s_validate_coredns_custom
  when: "'dns' in tailscale_k8s_actions"

- name: Assert CoreDNS forwards ts.net to the Tailscale nameserver
  ansible.builtin.assert:
    that:
      - tailscale_k8s_validate_coredns_custom.resources | length == 1
      - "'ts.net.server' in tailscale_k8s_validate_coredns_custom.resources[0].data"
      - tailscale_k8s_validate_dnsconfig.resources[0].status.nameserver.ip in tailscale_k8s_validate_coredns_custom.resources[0].data['ts.net.server']
  fail_msg: "CoreDNS is missing the managed ts.net stub for in-cluster MagicDNS."
  when: "'dns' in tailscale_k8s_actions"
