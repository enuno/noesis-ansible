---
- name: Reject Kubernetes-only exposure for Docker
  ansible.builtin.assert:
    that: not (gbrain_k8s_expose_enabled | bool)
    fail_msg: Docker is loopback-only; Tailscale Ingress is Kubernetes-only.
  tags: [gbrain, docker, install]

- name: Require escrowed database URLs before starting the container
  ansible.builtin.assert:
    that:
      - (gbrain_k8s_database_url | default('') | length) > 0
      - (gbrain_k8s_direct_database_url | default('') | length) > 0
    fail_msg: >-
      Pass gbrain_k8s_database_url and gbrain_k8s_direct_database_url (or
      write them via extra-vars file). The Docker path does not start
      without both Supabase URLs.
  when: not ansible_check_mode
  tags: [gbrain, docker, install]

- name: Run the GBrain container on loopback
  community.docker.docker_container:
    name: "{{ gbrain_k8s_docker_container_name }}"
    image: "{{ gbrain_k8s_image_repository }}:{{ gbrain_k8s_image_tag }}"
    state: started
    restart_policy: unless-stopped
    pull: false
    published_ports:
      - "{{ gbrain_k8s_docker_published_port }}"
    env:
      GBRAIN_HOME: "{{ gbrain_k8s_docker_data_dir }}"
      GBRAIN_DATABASE_URL: "{{ gbrain_k8s_database_url }}"
      DATABASE_URL: "{{ gbrain_k8s_database_url }}"
      GBRAIN_DIRECT_DATABASE_URL: "{{ gbrain_k8s_direct_database_url }}"
    volumes:
      - "{{ gbrain_k8s_docker_data_dir }}:{{ gbrain_k8s_docker_data_dir }}"
    command:
      - serve
      - --http
      - --port
      - "{{ gbrain_k8s_service_port | string }}"
      - --bind
      - "{{ gbrain_k8s_serve_bind }}"
  no_log: true
  when: not ansible_check_mode
  tags: [gbrain, docker, install]

- name: Report that check mode does not start the container
  ansible.builtin.debug:
    msg: check mode skips docker_container.
  when: ansible_check_mode
  tags: [gbrain, docker, install]
