---
- name: Validate GBrain Kubernetes target and configuration before any change
  ansible.builtin.assert:
    that:
      - gbrain_k8s_kubeconfig | length > 0
      - gbrain_k8s_context | length > 0
      - gbrain_k8s_namespace | length > 0
      - gbrain_k8s_release_name | length > 0
      - gbrain_k8s_bw_project_id == gbrain_k8s_required_bw_project_id
      - gbrain_k8s_chart_version | length > 0
      - gbrain_k8s_image_tag != 'latest'
      - gbrain_k8s_hostname is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$')
      - gbrain_k8s_ingress_class == 'tailscale'
      - gbrain_k8s_serve_bind == '0.0.0.0'
      - gbrain_k8s_canonical_hostname is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$')
      - "'.' in gbrain_k8s_canonical_hostname"
    fail_msg: >-
      GBrain Kubernetes preflight failed. Set gbrain_k8s_kubeconfig and
      gbrain_k8s_context explicitly. Bitwarden project must be
      {{ gbrain_k8s_required_bw_project_id }}. Serve bind must be 0.0.0.0
      (upstream default 127.0.0.1 is unreachable from a Service).
  tags: [gbrain, k8s, validate]

- name: Check that the effective task user can actually read the kubeconfig
  ansible.builtin.stat:
    path: "{{ gbrain_k8s_kubeconfig }}"
  register: gbrain_k8s_kubeconfig_stat
  tags: [gbrain, k8s, validate]

- name: Fail with a useful message when the kubeconfig is unreadable
  ansible.builtin.fail:
    msg: >-
      The effective task user cannot read {{ gbrain_k8s_kubeconfig }}.
      Point gbrain_k8s_kubeconfig at /etc/rancher/k3s/k3s.yaml (root-owned,
      readable because these plays run with become). Do not point it at a
      per-user ~/.kube/config.
  when: >-
    not gbrain_k8s_kubeconfig_stat.stat.exists
    or not (gbrain_k8s_kubeconfig_stat.stat.readable | default(false))
  tags: [gbrain, k8s, validate]

- name: Resolve the target cluster context explicitly
  kubernetes.core.k8s_cluster_info:
    kubeconfig: "{{ gbrain_k8s_kubeconfig }}"
    context: "{{ gbrain_k8s_context }}"
    invalidate_cache: true
  register: gbrain_k8s_target
  changed_when: false
  tags: [gbrain, k8s, validate]

- name: Read the context names declared in the kubeconfig
  ansible.builtin.slurp:
    src: "{{ gbrain_k8s_kubeconfig }}"
  register: gbrain_k8s_kubeconfig_raw
  changed_when: false
  no_log: true
  tags: [gbrain, k8s, validate]

- name: Fail closed if the named context is absent from the kubeconfig
  ansible.builtin.assert:
    that:
      - gbrain_k8s_context in (((gbrain_k8s_kubeconfig_raw.content
         | b64decode | from_yaml | default({}, true)).get('contexts') or [])
         | map(attribute='name') | list)
    fail_msg: >-
      Context '{{ gbrain_k8s_context }}' was not found in
      {{ gbrain_k8s_kubeconfig }}. Refusing to fall back to the current
      kubectl context.
  tags: [gbrain, k8s, validate]

- name: Assert the in-repo chart exists at the role-relative path
  ansible.builtin.stat:
    path: "{{ role_path }}/../../charts/gbrain/Chart.yaml"
  register: gbrain_k8s_chart_stat
  tags: [gbrain, k8s, validate]

- name: Fail when the GBrain chart path does not resolve
  ansible.builtin.assert:
    that:
      - gbrain_k8s_chart_stat.stat.exists | default(false)
    fail_msg: >-
      Chart not found at {{ role_path }}/../../charts/gbrain. kubernetes.core.helm
      chart_ref resolves against the ROLE directory, not the repo root.
  tags: [gbrain, k8s, validate]
