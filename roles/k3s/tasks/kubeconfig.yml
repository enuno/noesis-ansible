---
# Point the generated kubeconfig at the tailnet address so `kubectl` works
# from any machine on the tailnet, not only from this host.
#
# k3s writes the kubeconfig with `server: https://127.0.0.1:6443`, which is
# unreachable from a remote operator machine.
#
# IMPORTANT ordering: k3s REWRITES /etc/rancher/k3s/k3s.yaml on every start, so
# this must run AFTER the restart handler -- otherwise the next k3s start
# silently resets the address back to loopback. The playbook flushes handlers
# before including this file.

- name: Refuse an empty or loopback kubeconfig server address
  ansible.builtin.assert:
    that:
      - k3s_kubeconfig_server | length > 0
      - k3s_kubeconfig_server is match('^https?://(?!127\\.0\\.0\\.1|localhost)')
    fail_msg: >-
      k3s_kubeconfig_server must be an explicit non-loopback address so remote
      kubectl can reach the API server. Got {{ k3s_kubeconfig_server | default('<unset>') }}.
  when: k3s_kubeconfig_server | length > 0
  tags: [k3s, kubeconfig]

- name: Read the current kubeconfig server address
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      grep -E '^[[:space:]]*server:' "{{ k3s_kubeconfig_file }}" \
        | head -1 \
        | sed -E 's/^[[:space:]]*server:[[:space:]]*//; s/^"//; s/"$//'
  register: k3s_kubeconfig_server_current
  changed_when: false
  failed_when: false
  when: k3s_kubeconfig_server | length > 0
  tags: [k3s, kubeconfig]
  # The rewrite below writes the address QUOTED. Without stripping the
  # surrounding quotes here, the comparison in the next task compared
  # '"https://host:6443"' against 'https://host:6443', never matched, and the
  # rewrite reported `changed` on every single run — breaking the role's
  # idempotence guarantee and firing a spurious diff on each converged run.

- name: Rewrite the kubeconfig server address to the tailnet endpoint
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      tmp="$(mktemp)"
      python3 - "$tmp" <<'PY'
      import re, sys
      path = sys.argv[1]
      with open("/etc/rancher/k3s/k3s.yaml") as fh:
          text = fh.read()
      new = re.sub(r'(^[ \t]*server:[ \t]*)\S+', r'\g<1>"https://REPLACE_ME"', text, count=1, flags=re.M)
      if new == text:
          raise SystemExit("no `server:` key found in the kubeconfig; refusing to guess")
      with open(path, "w") as fh:
          fh.write(new)
      PY
      sed -i "s|https://REPLACE_ME|{{ k3s_kubeconfig_server }}|" "$tmp"
      install -o root -g root -m 0600 "$tmp" "{{ k3s_kubeconfig_file }}"
      rm -f "$tmp"
  when:
    - k3s_kubeconfig_server | length > 0
    - k3s_kubeconfig_server_current.stdout | default('') | trim != k3s_kubeconfig_server
  changed_when: true
  no_log: true
  tags: [k3s, kubeconfig]

- name: Report the kubeconfig server address
  ansible.builtin.debug:
    msg: >-
      kubeconfig {{ k3s_kubeconfig_file }} points at
      {{ k3s_kubeconfig_server_current.stdout | default('(unchanged)') }}.
      Copy this file to an operator machine to use `kubectl` over the tailnet.
  when: k3s_kubeconfig_server | length > 0
  tags: [k3s, kubeconfig]
