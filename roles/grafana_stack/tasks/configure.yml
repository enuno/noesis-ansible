---
- name: Render Prometheus configuration
  ansible.builtin.template:
    src: prometheus-config.yml.j2
    dest: "{{ grafana_stack_config_dir }}/prometheus.yml"
    mode: '0644'
  notify: restart_grafana_stack
  when: grafana_stack_enable_prometheus | bool

- name: Render Loki configuration
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: "{{ grafana_stack_config_dir }}/loki.yml"
    mode: '0644'
  notify: restart_grafana_stack
  when: grafana_stack_enable_loki | bool

- name: Render Tempo configuration
  ansible.builtin.template:
    src: tempo-config.yml.j2
    dest: "{{ grafana_stack_config_dir }}/tempo.yml"
    mode: '0644'
  notify: restart_grafana_stack
  when: grafana_stack_enable_tempo | bool

- name: Render Grafana datasource provisioning
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: "{{ grafana_stack_config_dir }}/datasources.yml"
    mode: '0644'
  notify: restart_grafana_stack
  when: grafana_stack_enable_grafana | bool

- name: Render Grafana environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ grafana_stack_data_dir }}/.env"
    mode: '0600'
  notify: restart_grafana_stack
  when: grafana_stack_enable_grafana | bool
  no_log: true

- name: Render Docker Compose manifest
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ grafana_stack_data_dir }}/docker-compose.yml"
    mode: '0644'
  notify: restart_grafana_stack

- name: Deploy Grafana Stack with Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ grafana_stack_data_dir }}"
    state: present
    wait: true
    wait_timeout: 120
  register: grafana_stack_deploy
  when: not ansible_check_mode
