---
# roles/helm/defaults/main.yml
# Pinned Helm CLI for the TARGET host (Ubuntu x86_64). The pin satisfies the
# spec requirement: "Install a pinned Helm CLI where needed for the chosen
# execution model" — kubernetes.core.helm shells out to the helm binary on
# the execution host, which for the praxis-k3s playbooks is the target itself
# (see docs/praxis-k3s/pins.md, "Execution model" addendum).

# Pin source: https://api.github.com/repos/helm/helm/releases (latest stable,
# non-prerelease, non-draft, at authoring time: v4.3.1, published
# 2026-10-15T01:08:37Z).
helm_version: "v4.3.1"

# SHA-256 of helm-{{ helm_version }}-linux-amd64.tar.gz, taken from the
# official checksum file at
# https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz.sha256sum
# (verified at authoring time; get_url checksum-enforced on every install).
helm_sha256: "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b"

helm_download_base: "https://get.helm.sh"
helm_download_url: "{{ helm_download_base }}/helm-{{ helm_version }}-linux-amd64.tar.gz"
helm_install_dir: "/usr/local/bin"
# Scratch location for the downloaded tarball / unpacked directory.
helm_download_dir: "/var/tmp"
