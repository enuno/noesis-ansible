---
- name: Remove OpenClaw agent container
  community.docker.docker_container:
    name: "{{ openclaw_agent_container_name }}"
    state: absent

- name: Remove OpenClaw agent Docker image
  community.docker.docker_image:
    name: "{{ openclaw_agent_image_name }}"
    tag: "{{ openclaw_agent_image_tag }}"
    state: absent

- name: Remove OpenClaw generated state and build directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ openclaw_agent_data_dir }}"
    - "{{ openclaw_agent_build_dir }}"
