apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openclaw.fullname" . }}-seed
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": {{ .Values.gateway.bind | quote }},
        "port": {{ .Values.gateway.port }},
        "auth": {
          "mode": {{ .Values.gateway.authMode | quote }}
        },
        "tailscale": {
          "mode": "off"
        },
        "controlUi": {
          "enabled": true{{- if .Values.gateway.allowedOrigins }},
          "allowedOrigins": {{ .Values.gateway.allowedOrigins | toJson }}{{- end }}
        }{{- if .Values.gateway.trustedProxies }},
        "trustedProxies": {{ .Values.gateway.trustedProxies | toJson }}{{- end }}
      },
      "agents": {
        "defaults": {
          "workspace": "~/.openclaw/workspace"
        },
        "entries": {
          "default": {
            "name": "OpenClaw Assistant",
            "workspace": "~/.openclaw/workspace"
          }
        }
      },
      "cron": { "enabled": false }
    }
  AGENTS.md: |
    # OpenClaw Kubernetes Worker

    This worker is not a supervisor. Infrastructure actions require the external
    dry-run, blast-radius, and per-action approval broker defined by the operator.
    Do not infer credentials, broker APIs, or cluster authority from this file.
