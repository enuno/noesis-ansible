{{- /*
MCPJungle Deployment.

Interface notes (verified against upstream 0.4.6):
  - health endpoint is GET /health (internal/api/server.go), unauthenticated.
  - MCP transport is /mcp (streamable HTTP) and /sse + /message (SSE transport).
  - There is NO --ui flag; the dashboard is always served at /.
  - Credentials arrive via *_FILE env vars, never as literal values in the manifest.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcpjungle.fullname" . }}
  labels:
    {{- include "mcpjungle.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcpjungle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mcpjungle.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mcpjungle.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if and (eq .Values.database.mode "postgres") .Values.database.postgres.existingSecret }}
            - name: POSTGRES_HOST
              value: {{ required "database.postgres.host is required when mode=postgres" .Values.database.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.database.postgres.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.postgres.user | quote }}
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/mcpjungle/db/{{ .Values.database.postgres.existingSecretKey }}
            {{- end }}
            {{- range .Values.envFromSecrets }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and (eq .Values.database.mode "postgres") .Values.database.postgres.existingSecret }}
            - name: db-credentials
              mountPath: /etc/mcpjungle/db
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and (eq .Values.database.mode "postgres") .Values.database.postgres.existingSecret }}
        - name: db-credentials
          secret:
            secretName: {{ .Values.database.postgres.existingSecret }}
            items:
              - key: {{ .Values.database.postgres.existingSecretKey }}
                path: {{ .Values.database.postgres.existingSecretKey }}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "mcpjungle.fullname" . }}-data
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}