[mcp_gateway_k8s]
# TARGET cluster control node. Same machine as mcpjungle-k8s / praxis k3s.
# Kubernetes node name is noesis-praxis; inventory alias is noesis-lab.
noesis-lab ansible_host=100.119.84.26 ansible_user=ansible

# Opt-in same-host run. Not in [mcp_gateway_k8s] so a dual listing cannot
# execute every task twice against one cluster.
[mcp_gateway_k8s_samehost]
localhost ansible_connection=local

[mcp_gateway_k8s:vars]
ansible_python_interpreter=/usr/bin/python3
