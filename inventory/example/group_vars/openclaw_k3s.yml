---
# Non-secret placeholders for syntax checks and offline tests only.
openclaw_k8s_kubeconfig_path: /etc/rancher/k3s/k3s.yaml
openclaw_k8s_kube_context: CHANGE_ME_CONTEXT
openclaw_k8s_release_name: openclaw
openclaw_k8s_namespace: openclaw
openclaw_k8s_image_tag: "2026.10.7-slim"
openclaw_k8s_image_digest: sha256:fb26f0841659dc757f23feec9adeab51f11d76779a409db5d22e191b43841afa
openclaw_k8s_existing_secret: change-me-openclaw-secret
openclaw_k8s_storage_class: CHANGE_ME_STORAGE_CLASS
openclaw_k8s_exposure_enabled: true
openclaw_k8s_ingress_class_name: tailscale
# A bare hostspec only. The Tailscale operator appends the tailnet domain
# itself, so this must never carry a *.ts.net FQDN.
openclaw_k8s_tailnet_hostname: openclaw
# The tailnet's MagicDNS domain, kept separate from the hostspec so the
# Control UI's allowedOrigins can name the browser's real origin.
openclaw_k8s_tailnet_domain: CHANGE_ME_TAILNET_DOMAIN
openclaw_k8s_tailscale_operator_namespace: tailscale
openclaw_k8s_allowed_origins:
  - https://openclaw.CHANGE_ME_TAILNET_DOMAIN
openclaw_k8s_gateway_bind: lan
openclaw_k8s_gateway_auth_mode: token
openclaw_k8s_worker_identity: research-openclaw
openclaw_k8s_broker_endpoint: ""
openclaw_k8s_broker_secret_name: ""
openclaw_k8s_broker_secret_key: ""
openclaw_k8s_live_checks: false
openclaw_k8s_destroy_pvc: false
