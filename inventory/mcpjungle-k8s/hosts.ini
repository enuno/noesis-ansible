[mcpjungle_k8s]
# TARGET cluster control node.
#
# These values describe the CLUSTER, not the machine running Ansible, so they
# stay correct when the deployer moves to another host.
#
# HOST vs KUBERNETES NODE (2026-10-24) — deliberately different:
#   machine / OS hostname : noesis-lab (noesis-lab.hashgrid.net), tailnet
#                           device `noesis-lab` = 100.119.84.26
#   Kubernetes node name  : noesis-praxis (pinned via k3s_node_name; the
#                           cluster's local-path PVs are bound to it)
# The alias below names the MACHINE we connect to. Anything that must match
# the Kubernetes node must use the node name `noesis-praxis`, never this alias.
#
# 100.119.84.26 is the host's tailscale0 address (k3s v1.37.1+k3s1, single
# amd64 node). SSH as `ansible` over the tailnet was verified working with
# passwordless sudo.
noesis-lab ansible_host=100.119.84.26 ansible_user=ansible

# Opt-in same-host run. Deliberately NOT in [mcpjungle_k8s]: `noesis-lab`
# and `localhost` are the SAME machine, so having both in the target group
# would run every task twice against one cluster. Select it explicitly with
#   -i inventory/mcpjungle-k8s/hosts.ini playbooks/mcpjungle-k8s.yml \
#     -l localhost
# or `-i inventory/local/hosts.ini`.
[mcpjungle_k8s_samehost]
localhost ansible_connection=local

[mcpjungle_k8s:vars]
ansible_python_interpreter=/usr/bin/python3

# ---------------------------------------------------------------------------
# LOGIN IDENTITY: `ansible`, never `elvis`.
#
# The kubeconfig blocker that used to force `-e noesispraxis_ansible_user=elvis`
# is RESOLVED: mcpjungle_k8s_kubeconfig now points at the root-owned
# /etc/rancher/k3s/k3s.yaml instead of /home/elvis/.kube/config (which was
# 0660 elvis:elvis inside a 0700 home and unreadable by `ansible`). The plays
# run with become, so the k3s path works for any login identity. Do not
# reintroduce a per-user ~/.kube/config here.
#
# STILL AN OPEN PREREQUISITE — bitwarden token:
#   BWS_ACCESS_TOKEN lives in elvis's shell profile and is NOT present in the
#   `ansible` account. Escrow tasks execute ON THE TARGET, so they authenticate
#   with that account's environment. This is deliberately NOT auto-fixed:
#   granting an automation account an org-wide secrets token is a security
#   decision for the owner.
#
#   It only bites the escrow path. Deploys that do not read or write Bitwarden
#   are unaffected. When escrow IS needed, either provision the token into the
#   `ansible` account's non-interactive environment, or pass it explicitly for
#   that run. Note a credential exported from an interactive profile is
#   invisible to a non-interactive task, so verify with the same wrapper the
#   tasks use rather than a bare shell probe.