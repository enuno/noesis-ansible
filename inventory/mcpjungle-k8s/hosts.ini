[mcpjungle_k8s]
# TARGET cluster control node.
#
# These values describe the CLUSTER, not the machine running Ansible, so they
# stay correct when the deployer moves to another host.
#
# noesis-praxis is the k3s control node: 100.119.84.26 is its tailscale0
# address (k3s v1.37.1+k3s1, single amd64 node). SSH as `ansible` over the
# tailnet was verified working with passwordless sudo.
noesis-praxis ansible_host=100.119.84.26 ansible_user=ansible

# Opt-in same-host run. Deliberately NOT in [mcpjungle_k8s]: `noesis-praxis`
# and `localhost` are the SAME machine, so having both in the target group
# would run every task twice against one cluster. Select it explicitly with
#   -i inventory/mcpjungle-k8s/hosts.ini playbooks/mcpjungle-k8s.yml \
#     -l localhost
# or `-i inventory/local/hosts.ini`.
[mcpjungle_k8s_samehost]
localhost ansible_connection=local

[mcpjungle_k8s:vars]
ansible_python_interpreter=/usr/bin/python3

# ---------------------------------------------------------------------------
# PREREQUISITES for the remote (`ansible`) path — verified 2026-10-22, NOT
# satisfied out of the box:
#
#   kubeconfig      /home/elvis/.kube/config is 0660 elvis:elvis inside a 0700
#                   directory; `ansible` is not in group `elvis`, so it cannot
#                   read or traverse it. The run would die on a permission error.
#   bitwarden token BWS_ACCESS_TOKEN lives in elvis's shell profile and is not
#                   present in the `ansible` account, so escrow cannot auth.
#
# Both run ON THE TARGET (tasks execute there), not on the deployer. They are
# deliberately NOT auto-fixed: granting the `ansible` account read access to a
# cluster-admin kubeconfig and an org-wide secrets token is a security decision.
#
# Until then, run as the account that already owns both:
#   ansible-playbook -i inventory/mcpjungle-k8s/hosts.ini \
#     playbooks/mcpjungle-k8s.yml -e noesispraxis_ansible_user=elvis