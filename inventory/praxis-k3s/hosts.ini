# Single-node k3s server inventory.
#
# HOST vs KUBERNETES NODE — these are deliberately different (2026-10-24):
#
#   inventory alias / OS hostname : noesis-lab  (noesis-lab.hashgrid.net)
#   Kubernetes node name          : noesis-praxis
#
# The machine was renamed to `noesis-lab` so it stops colliding with the
# `noesis-praxis` k3s instance. The Kubernetes node keeps the name
# `noesis-praxis` because the cluster's local-path PersistentVolumes are
# pinned to it by node affinity; that is enforced explicitly via
# `k3s_node_name` in group_vars/k3s_server.yml, NOT inferred from the
# hostname. Do not "fix" the mismatch by aligning them.
#
# The alias here names the MACHINE, because that is what these plays
# configure (OS packages, sysctls, systemd units, host tailscaled). Group
# vars are keyed on the GROUP (k3s_server / buzz_k3s), so renaming this
# alias does not change which variables apply.
#
# Become (sudo) is configured at play level in playbooks/k3s-*.yml;
# no per-host become overrides here.
#
# LOGIN IDENTITY: `ansible`, never `elvis`. The `ansible` account has
# passwordless sudo (verified) and is the standard automation identity for
# every Linux target in this repo. Note `ansible_user` (who logs in) is a
# different knob from a play's `remote_user` (who you become after login).
#
# The SSH key is a DEPLOYER-side setting, so it lives in group_vars/all.yml as
# an overridable variable rather than being hardcoded per host here.

[k3s_server]
noesis-lab ansible_host=31.97.209.57 ansible_user=ansible

# Buzz deploy target: same host, same public-IP deploy channel. The role runs
# Helm on this host against the local kubeconfig; tailnet access to the relay
# is via the tailscale IngressClass (device 'buzz'), not this IP.
[buzz_k3s]
noesis-lab ansible_host=31.97.209.57 ansible_user=ansible
