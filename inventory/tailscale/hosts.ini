# Tailscale-reachable agent hosts.
#
# LOGIN IDENTITY EXCEPTION — this host legitimately uses `elvis`, not `ansible`.
#
# Every Linux target in this repo logs in as `ansible`. This entry does NOT,
# and must not be "fixed" to match. macbook-pro-m1pro is a macOS (Darwin)
# machine with no `ansible` account at all — verified directly:
#
#   ssh elvis@100.71.2.14 'id ansible'  ->  id: ansible: no such user
#   ssh ansible@100.71.2.14             ->  Permission denied (publickey,...)
#
# Forcing ansible_user=ansible here, or applying a blanket `remote_user` sweep
# to macOS plays, breaks the connection outright. `ansible_user` describes who
# can actually log in to THIS machine; it is not a policy knob.
#
# The SSH key is the shared automation keypair (hashgrid_signing_key), the same
# key used for the Linux targets.

[tailscale]
macbook-pro-m1pro ansible_host=100.71.2.14 ansible_user=elvis ansible_ssh_private_key_file=~/.ssh/hashgrid_signing_key

[macos]
macbook-pro-m1pro

[agents:children]
tailscale
