---
# Apply the Honcho memory module and runtime policy to a managed host.

- name: Apply Honcho memory standard
  hosts: local
  gather_facts: true
  tags: [honcho]

  pre_tasks:
    - name: Validate toggle
      ansible.builtin.assert:
        that:
          - honcho_enabled | default(noesispraxis_enable_honcho | default(false)) | bool
        fail_msg: "Honcho is disabled. Set noesispraxis_enable_honcho=true or honcho_enabled=true."

  roles:
    - role: honcho
      tags: [honcho]

  post_tasks:
    - name: Report Honcho staging path
      ansible.builtin.debug:
        msg: "Honcho staged at {{ honcho_stage_dir }} and runtime files written to {{ honcho_runtime_dir }}"

