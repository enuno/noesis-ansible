---
# hermes-profiles.yml — Apply profile fleets (Noesis 16-agent roster; Agency
# Tier A behind its toggle) to a Hermes CLI home.
# Requires the hermes binary on the target (roles/hermes deploys a container;
# run this against a host with the hermes CLI installed).
#
# Fleets are declared in ONE var: hermes_profiles_fleets
# (roles/hermes_profiles/defaults/main.yml). It drives install, configure,
# and validate (A5). Agency is default-OFF:
#   noesispraxis_enable_agency_profiles: true   # only after the operator
#                                                # review gate (stack repo
#                                                # agency/REVIEW-GATE.md)
#
# Usage:
#   ansible-playbook -i inventory/local/hosts.ini playbooks/hermes-profiles.yml
#   ansible-playbook -i inventory/local/hosts.ini playbooks/hermes-profiles.yml -e hermes_profiles_fleets.noesis.mode=wave1
#   ansible-playbook -i inventory/local/hosts.ini playbooks/hermes-profiles.yml -e '{"hermes_profiles_fleets":{"noesis":{"want":["noesis-forge","noesis-sentinel"]}}}'

- name: Apply Noesis profile fleet
  hosts: local
  gather_facts: true
  tags: [runtime, hermes, hermes_profiles]

  pre_tasks:
    - name: Validate toggle
      ansible.builtin.assert:
        that:
          - noesispraxis_enable_noesis_profiles | default(true) | bool
        fail_msg: "Noesis profiles disabled. Check group_vars/all.yml"

  roles:
    - role: hermes_profiles
      tags: [hermes_profiles]

  post_tasks:
    - name: Report fleet deployment
      ansible.builtin.debug:
        msg: "Noesis profile fleet applied to {{ ansible_facts.env.HOME }}/.hermes — see {{ hermes_profiles_stage_dir }}/apply.log"
