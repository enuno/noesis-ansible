---
- name: Apply the OpenClaw Secret from Bitwarden Secrets Manager
  hosts: openclaw_k3s
  gather_facts: false
  become: true
  tags: [openclaw, secret]
  # These playbooks do not declare the openclaw_k8s role, so the role's
  # defaults are NOT in scope. Without this the target-side Kubernetes Python
  # venv path is undefined and the play dies before it does anything. Import
  # the role's own defaults file so there is ONE source of truth for these
  # values instead of a copy that can drift.
  vars_files:
    - "{{ playbook_dir }}/../roles/openclaw_k8s/defaults/main.yml"
  vars:
    openclaw_k8s_bws_project_id: ""
    # The Gateway auth-token is escrowed under this key; it is what
    # `openclaw gateway auth-token --show` reveals on the Gateway host.
    openclaw_k8s_secret_sources:
      OPENCLAW_GATEWAY_TOKEN: OPENCLAW_K3S_NOESIS_GATEWAY_TOKEN
      TYPESAFE_API_KEY: TYPESAFE_API_KEY
      ANTHROPIC_API_KEY: ANTHROPIC_API_KEY
  pre_tasks:

    - name: Install Python venv support with the pinned system interpreter
      ansible.builtin.apt:
        name: python3-venv
        state: present
      vars:
        ansible_python_interpreter: /usr/bin/python3.14

    - name: Create dedicated target-side Kubernetes Python environment
      ansible.builtin.command:
        cmd: "/usr/bin/python3.14 -m venv {{ openclaw_k8s_kubernetes_venv }}"
        creates: "{{ openclaw_k8s_kubernetes_venv }}/bin/python"
      vars:
        ansible_python_interpreter: /usr/bin/python3.14

    - name: Install exact Kubernetes Python client pin
      ansible.builtin.pip:
        name: "kubernetes=={{ openclaw_k8s_kubernetes_python_version }}"
        virtualenv: "{{ openclaw_k8s_kubernetes_venv }}"
        state: present

    - name: Select pinned target-side Kubernetes Python environment
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ openclaw_k8s_kubernetes_venv }}/bin/python"

    - name: Validate secret source configuration
      ansible.builtin.assert:
        that:
          - openclaw_k8s_bws_project_id | length > 0
          - openclaw_k8s_existing_secret | length > 0
          - openclaw_k8s_secret_sources.OPENCLAW_GATEWAY_TOKEN is defined
      no_log: true
    - name: Read all configured secrets once from Bitwarden Secrets Manager
      ansible.builtin.command:
        argv: [bws, secret, list, "{{ openclaw_k8s_bws_project_id }}", -o, json]
      delegate_to: localhost
      run_once: true
      become: false
      register: openclaw_k8s_bws_secret_list
      retries: 5
      delay: 5
      until: openclaw_k8s_bws_secret_list.rc == 0
      changed_when: false
      no_log: true
    - name: Index Bitwarden values by key
      ansible.builtin.set_fact:
        openclaw_k8s_bws_secrets: >-
          {{ openclaw_k8s_bws_secret_list.stdout | from_json |
             items2dict(key_name='key', value_name='value') }}
      no_log: true
    - name: Verify every configured Bitwarden source key exists
      ansible.builtin.assert:
        that:
          - openclaw_k8s_bws_secrets[item.value] is defined
          - openclaw_k8s_bws_secrets[item.value] | trim | length > 0
        fail_msg: A configured Bitwarden source key is missing or empty.
      loop: "{{ openclaw_k8s_secret_sources | dict2items }}"
      no_log: true
    - name: Build trimmed Secret data map
      ansible.builtin.set_fact:
        openclaw_k8s_secret_data: >-
          {{ openclaw_k8s_secret_data | default({}) |
             combine({item.key: openclaw_k8s_bws_secrets[item.value] | trim}) }}
      loop: "{{ openclaw_k8s_secret_sources | dict2items }}"
      no_log: true
  tasks:
    - name: Ensure the OpenClaw namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ openclaw_k8s_kubeconfig_path }}"
        context: "{{ openclaw_k8s_kube_context }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ openclaw_k8s_namespace }}"
            labels:
              app.kubernetes.io/managed-by: ansible-openclaw-secret
    - name: Apply OpenClaw Secret without printing values
      kubernetes.core.k8s:
        kubeconfig: "{{ openclaw_k8s_kubeconfig_path }}"
        context: "{{ openclaw_k8s_kube_context }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ openclaw_k8s_existing_secret }}"
            namespace: "{{ openclaw_k8s_namespace }}"
          type: Opaque
          stringData: "{{ openclaw_k8s_secret_data }}"
      no_log: true
  post_tasks:
    - name: Read back the applied Secret without printing values
      kubernetes.core.k8s_info:
        kubeconfig: "{{ openclaw_k8s_kubeconfig_path }}"
        context: "{{ openclaw_k8s_kube_context }}"
        api_version: v1
        kind: Secret
        namespace: "{{ openclaw_k8s_namespace }}"
        name: "{{ openclaw_k8s_existing_secret }}"
      register: openclaw_k8s_secret_readback
      no_log: true
    - name: Verify the applied Secret has every requested key
      ansible.builtin.assert:
        that:
          - openclaw_k8s_secret_readback.resources | length == 1
          - >-
            openclaw_k8s_secret_sources.keys() | list | difference(
              openclaw_k8s_secret_readback.resources[0].data.keys() | list
            ) | length == 0
        fail_msg: Applied OpenClaw Secret is missing one or more configured keys.
      no_log: true
