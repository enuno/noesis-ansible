---
# Apply the operator-managed Kubernetes Secret consumed by the Buzz chart
# (buzz_existing_secret: buzz-secrets). Values are read at runtime from
# Bitwarden Secrets Manager project noosphere by the controller via `bws`;
# they are never written to inventory, never committed, and task output is
# suppressed with no_log. This play creates or updates the Secret in place;
# it does not print or rotate values.
#
# Source keys (Bitwarden) -> Secret keys (Kubernetes):
#   BUZZ_RELAY_PRIVATE_KEY    -> BUZZ_RELAY_PRIVATE_KEY
#   BUZZ_GIT_HOOK_HMAC_SECRET -> BUZZ_GIT_HOOK_HMAC_SECRET
#   BUZZ_DATABASE_URL         -> DATABASE_URL
#   BUZZ_REDIS_URL            -> REDIS_URL
#   R2_ADMIN_ACCESS_KEY_ID     -> BUZZ_S3_ACCESS_KEY
#   R2_ADMIN_SECRET_ACCESS_KEY -> BUZZ_S3_SECRET_KEY
#
# Usage:
#   ansible-playbook -i inventory/praxis-k3s/hosts.ini playbooks/buzz-secret.yml

- name: Apply the Buzz operator Secret from Bitwarden Secrets Manager
  hosts: buzz_k3s
  gather_facts: false
  become: true
  become_method: sudo
  tags: [buzz, secret]

  vars:
    buzz_kubeconfig_path: /etc/rancher/k3s/k3s.yaml
    buzz_kube_context: "default"
    buzz_namespace: buzz
    buzz_secret_name: buzz-secrets
    bws_project_id: "72974d0e-81af-4678-bab7-b46000985859"
    # Pinned target-side Python environment for kubernetes.core modules.
    # See docs/praxis-k3s/pins.md.
    hermes_kubernetes_python_version: "34.1.0"
    hermes_kubernetes_venv: /opt/ansible-kubernetes
    # Map Kubernetes Secret keys to Bitwarden Secrets Manager keys.
    buzz_secret_sources:
      BUZZ_RELAY_PRIVATE_KEY: BUZZ_RELAY_PRIVATE_KEY
      BUZZ_GIT_HOOK_HMAC_SECRET: BUZZ_GIT_HOOK_HMAC_SECRET
      DATABASE_URL: BUZZ_DATABASE_URL
      REDIS_URL: BUZZ_REDIS_URL
      BUZZ_S3_ACCESS_KEY: R2_ADMIN_ACCESS_KEY_ID
      BUZZ_S3_SECRET_KEY: R2_ADMIN_SECRET_ACCESS_KEY

  pre_tasks:
    - name: Assert this play is not pointed at the placeholder example host
      ansible.builtin.assert:
        that:
          - inventory_hostname != 'buzz-k3s.example.invalid'
          - ansible_host | default('') != 'buzz-k3s.example.invalid'
        fail_msg: inventory/example is not a deploy target.

    - name: Install Python venv support for target-side kubernetes.core modules
      ansible.builtin.apt:
        name: python3-venv
        state: present

    - name: Create dedicated target-side Kubernetes Python environment
      ansible.builtin.command:
        cmd: "python3 -m venv {{ hermes_kubernetes_venv }}"
        creates: "{{ hermes_kubernetes_venv }}/bin/python"

    - name: Install exact Python kubernetes client pin in target venv
      ansible.builtin.pip:
        name: "kubernetes=={{ hermes_kubernetes_python_version }}"
        virtualenv: "{{ hermes_kubernetes_venv }}"
        state: present

    - name: Select pinned target-side Kubernetes Python environment
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ hermes_kubernetes_venv }}/bin/python"

    - name: Read all Buzz secrets from Bitwarden Secrets Manager (controller-side)
      ansible.builtin.command: "bws secret list {{ bws_project_id }} -o json"
      delegate_to: localhost
      run_once: true
      become: false
      register: _bws_secret_list
      retries: 5
      delay: 5
      until: _bws_secret_list.rc == 0
      changed_when: false
      no_log: true

    - name: Index secrets by key
      ansible.builtin.set_fact:
        _bws_secrets: "{{ _bws_secret_list.stdout | from_json | items2dict(key_name='key', value_name='value') }}"
      no_log: true

    - name: Verify every required source key exists in Bitwarden Secrets Manager
      ansible.builtin.assert:
        that:
          - _bws_secrets[item.value] is defined
          - _bws_secrets[item.value] | length > 0
        fail_msg: >-
          Required Bitwarden Secrets Manager key {{ item.value }} is missing or
          empty in project {{ bws_project_id }}. Create it there; this play does
          not invent secret values.
      loop: "{{ buzz_secret_sources | dict2items }}"
      loop_control:
        label: "{{ item.value }}"

    - name: Build the Secret data map (Secret key -> Bitwarden value)
      ansible.builtin.set_fact:
        _buzz_secret_data: "{{ _buzz_secret_data | default({}) | combine({item.key: _bws_secrets[item.value] | trim}) }}"
      loop: "{{ buzz_secret_sources | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true

    - name: Ensure the buzz namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ buzz_kubeconfig_path }}"
        context: "{{ buzz_kube_context }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ buzz_namespace }}"
            labels:
              app.kubernetes.io/managed-by: ansible-buzz-secret

  tasks:
    - name: Apply the Buzz Secret (values from Bitwarden Secrets Manager)
      kubernetes.core.k8s:
        kubeconfig: "{{ buzz_kubeconfig_path }}"
        context: "{{ buzz_kube_context }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ buzz_secret_name }}"
            namespace: "{{ buzz_namespace }}"
            labels:
              app.kubernetes.io/managed-by: ansible-buzz-secret
          type: Opaque
          stringData: "{{ _buzz_secret_data }}"
      no_log: true

  post_tasks:
    - name: Verify the Secret exists with the expected key count
      kubernetes.core.k8s_info:
        kubeconfig: "{{ buzz_kubeconfig_path }}"
        context: "{{ buzz_kube_context }}"
        api_version: v1
        kind: Secret
        name: "{{ buzz_secret_name }}"
        namespace: "{{ buzz_namespace }}"
      register: _buzz_secret_verify
      no_log: true

    - name: Assert the Secret exists with every expected key
      ansible.builtin.assert:
        that:
          - _buzz_secret_verify.resources | length == 1
          - _buzz_secret_verify.resources[0].data | default({}) | length == buzz_secret_sources | length
        fail_msg: Secret {{ buzz_secret_name }} missing or incomplete.
      vars:
        # Keys only; never data.
        _expected: "{{ buzz_secret_sources | dict2items | items2dict(key_name='key', value_name='value') | map_values(_bws_secrets) }}"
