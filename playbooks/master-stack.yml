---
# master-stack.yml — Phase-oriented master orchestrator for NoesisPraxis
# Run individual phases via tags: bootstrap, foundation, security, runtime,
# macos, telegram, tailscale, sync, validate, backup

- name: "PHASE 0 — Bootstrap"
  hosts: all
  gather_facts: true
  tags: [always, bootstrap]
  tasks:
    - name: Bootstrap complete
      ansible.builtin.debug:
        msg: "Bootstrap complete for {{ inventory_hostname }}"

- name: "PHASE 1 — Identity and Registries"
  hosts: local
  gather_facts: false
  tags: [foundation, registries]
  vars:
    _enable_acp: "{{ noesispraxis_enable_acp | default(true) | bool }}"
    _enable_ans: "{{ noesispraxis_enable_ans | default(true) | bool }}"
    _enable_agentregistry: "{{ noesispraxis_enable_agentregistry | default(true) | bool }}"
    _enable_a2a: "{{ noesispraxis_enable_a2a | default(true) | bool }}"
  tasks:
    - name: Include ACP registry
      ansible.builtin.include_role:
        name: acp_registry
      when: _enable_acp

    - name: Include ANS
      ansible.builtin.include_role:
        name: ans
      when: _enable_ans

    - name: Include Agent Registry dashboard
      ansible.builtin.include_role:
        name: agentregistry
      when: _enable_agentregistry

    - name: Include A2A registry
      ansible.builtin.include_role:
        name: a2a_registry
      when: _enable_a2a

    - name: Validate Phase 1
      ansible.builtin.include_role:
        name: validation
      when: noesispraxis_enable_validation | default(true) | bool

- name: "PHASE 2 — Security and Access"
  hosts: local
  gather_facts: false
  tags: [security]
  vars:
    _enable_mcpjungle: "{{ noesispraxis_enable_mcpjungle | default(true) | bool }}"
    _enable_clawvisor: "{{ noesispraxis_enable_clawvisor | default(true) | bool }}"
    _enable_host_unit_fixes: "{{ noesispraxis_enable_host_unit_fixes | default(true) | bool }}"
  tasks:
    - name: Include host systemd unit fixes
      ansible.builtin.include_role:
        name: host_unit_fixes
      when: _enable_host_unit_fixes

    - name: Include MCPJungle
      ansible.builtin.include_role:
        name: mcpjungle
      when: _enable_mcpjungle

    - name: Include Clawvisor
      ansible.builtin.include_role:
        name: clawvisor
      when: _enable_clawvisor

    - name: Validate Phase 2
      ansible.builtin.include_role:
        name: validation
      when: noesispraxis_enable_validation | default(true) | bool

- name: "PHASE 3 — Generic Runtime"
  hosts: local
  gather_facts: false
  tags: [runtime, generic]
  vars:
    _enable_generic: "{{ noesispraxis_enable_generic_agents | default(true) | bool }}"
  tasks:
    - name: Include AlphaClaw
      ansible.builtin.include_role:
        name: openclaw
      when: _enable_generic

    - name: Include Hermes
      ansible.builtin.include_role:
        name: hermes
      when: _enable_generic

    - name: Include Hermes profile fleet
      # Fleet registry (noesis + agency) is driven by ONE var:
      # roles/hermes_profiles/defaults/main.yml :: hermes_profiles_fleets.
      # Agency fleet is default-OFF (noesispraxis_enable_agency_profiles)
      # and gated behind the operator review gate in the stack repo
      # (agency/REVIEW-GATE.md). No changes needed here for agency enablement.
      ansible.builtin.include_role:
        name: hermes_profiles
      when:
        - _enable_generic
        - noesispraxis_enable_noesis_profiles | default(true) | bool


    - name: Include Honcho memory layer
      ansible.builtin.include_role:
        name: honcho
      when:
        - _enable_generic
        - noesispraxis_enable_honcho | default(false) | bool

    - name: Validate Phase 3
      ansible.builtin.include_role:
        name: validation
      when: noesispraxis_enable_validation | default(true) | bool

- name: "PHASE 4 — macOS-Specific Runtime"
  hosts: macos
  gather_facts: true
  tags: [macos]
  vars:
    _enable_macos: "{{ noesispraxis_enable_macos_agents | default(true) | bool }}"
  tasks:
    - name: Include macOS ClawDev
      ansible.builtin.include_role:
        name: macos_clawdev
      when: _enable_macos

    - name: Include macOS HermesDev
      ansible.builtin.include_role:
        name: macos_hermesdev
      when: _enable_macos

    - name: Validate Phase 4
      ansible.builtin.include_role:
        name: validation
      when: noesispraxis_enable_validation | default(true) | bool

- name: "PHASE 5 — Communications"
  hosts: local
  gather_facts: false
  tags: [telegram, communications]
  vars:
    _enable_telegram: "{{ noesispraxis_enable_telegram | default(true) | bool }}"
  tasks:
    - name: Include Telegram
      ansible.builtin.include_role:
        name: telegram
      when: _enable_telegram

    - name: Validate Phase 5
      ansible.builtin.include_role:
        name: validation
      when: noesispraxis_enable_validation | default(true) | bool

- name: "PHASE 6 — Networking"
  hosts: all
  gather_facts: true
  tags: [tailscale, networking]
  vars:
    _enable_tailscale: "{{ noesispraxis_enable_tailscale | default(true) | bool }}"
  tasks:
    - name: Fetch Tailscale auth key from Bitwarden
      ansible.builtin.include_role:
        name: bitwarden_secrets
      tags: [secrets]
      when:
        - _enable_tailscale
        - bitwarden_secrets_map | default({}) | length > 0
        - bitwarden_access_token | default(lookup('env', 'BWS_ACCESS_TOKEN')) | length > 0

    - name: Load fetched Tailscale secret
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/secrets.yml"
      ignore_errors: true
      no_log: true

    - name: Include Tailscale
      ansible.builtin.include_role:
        name: tailscale
      when: _enable_tailscale

    - name: Validate Phase 6
      ansible.builtin.include_role:
        name: validation
      when: noesispraxis_enable_validation | default(true) | bool

- name: "PHASE 7 — Synchronization and Backup"
  hosts: local
  gather_facts: false
  tags: [sync, backup]
  tasks:
    - name: Include Registry Sync
      ansible.builtin.include_role:
        name: registry_sync
      when: noesispraxis_enable_registry_sync | default(false) | bool

    - name: Include Backup
      ansible.builtin.include_role:
        name: backup
      when: noesispraxis_enable_backup | default(false) | bool

- name: "PHASE 8 — Observability (Grafana Stack)"
  hosts: local
  gather_facts: false
  tags: [observability, grafana-stack]
  tasks:
    - name: Include Grafana Stack
      ansible.builtin.include_role:
        name: grafana_stack
      when: noesispraxis_enable_grafana_stack | default(false) | bool

    - name: Validate Phase 8
      ansible.builtin.include_role:
        name: validation
      when: noesispraxis_enable_validation | default(true) | bool

- name: "PHASE 9 — Claude Code Bridge (development delegation)"
  hosts: local
  gather_facts: false
  tags: [claude-code-bridge, development]
  tasks:
    - name: Include Claude Code Bridge
      ansible.builtin.include_role:
        name: claude_code_bridge
      when: noesispraxis_enable_claude_code_bridge | default(false) | bool

    - name: Validate Phase 9
      ansible.builtin.include_role:
        name: validation
      when: noesispraxis_enable_validation | default(true) | bool

- name: "PHASE 10 — Final Validation"
  hosts: all
  gather_facts: false
  tags: [validate, always]
  tasks:
    - name: Include Validation
      ansible.builtin.include_role:
        name: validation
      when: noesispraxis_enable_validation | default(true) | bool
